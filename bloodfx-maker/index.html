<title>BloodFX Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* BloodFX Maker — a night-shift particle workshop.
   Layout: title bar, toolbar and workspace tabs across the top; each workspace is a grid of labelled panels
   (list on the left, viewport in the middle, inspector on the right); status bar along the bottom. */
:root {
  --bg0: #06090f;
  --bg1: #0b1019;
  --bg2: #0f1521;
  --bg3: #141b29;
  --bg4: #1b2435;
  --line: #182031;
  --line2: #243048;
  --text: #e7ecf5;
  --text2: #9ba7bd;
  --text3: #626f89;
  --accent: #3b82ff;
  --accent-rgb: 59, 130, 255;
  --accent-2: color-mix(in srgb, var(--accent) 78%, #fff);
  --accent-soft: rgba(var(--accent-rgb), 0.14);
  --accent-line: rgba(var(--accent-rgb), 0.55);
  --on-accent: #fff;
  --ok: #2fd38a;
  --warn: #f5b84a;
  --bad: #ff4d5e;
  --blood: #e0213a;
  --font-display: "Big Shoulders Display", "Bahnschrift", "Arial Narrow", sans-serif;
  --font-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg0); color: var(--text); font: 13.5px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(var(--accent-rgb), 0.35); }
[hidden] { display: none !important; }
svg { display: block; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.muted { color: var(--text3); }
kbd { font: 500 10.5px/1 var(--font-mono); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line2); color: var(--text2); background: var(--bg2); }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

/* ---------------------------------------------------------------- frame */
.app { height: 100%; display: flex; flex-direction: column; background: radial-gradient(1200px 500px at 70% -10%, rgba(var(--accent-rgb), 0.07), transparent 60%), var(--bg0); }
.titlebar { flex: none; height: 42px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; user-select: none; }
.titlebar button, .titlebar .file-chip { -webkit-app-region: no-drag; }
.brand { display: flex; align-items: center; gap: 9px; padding-right: 14px; border-right: 1px solid var(--line); height: 100%; }
.brand .logo { width: 24px; height: 24px; }
.wordmark { font: 800 16px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.ver { font: 600 10px/1 var(--font-mono); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); padding: 3px 6px; border-radius: 6px; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text3); white-space: nowrap; min-width: 0; }
.crumbs b { color: var(--text); font-weight: 600; }
.crumbs svg { width: 12px; height: 12px; }
.file-chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); font-size: 12px; color: var(--text2); max-width: 320px; min-width: 0; }
.file-chip .tag { font: 600 9.5px/1 var(--font-mono); padding: 2px 5px; border-radius: 4px; background: var(--bg4); color: var(--text2); }
.file-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip.empty { border-style: dashed; color: var(--text3); }
.grow { flex: 1; }
.caption-space { width: 0; flex: none; }
body.platform-desktop .caption-space { width: 140px; }

.toolbar { flex: none; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.toolbar .sep { width: 1px; height: 22px; background: var(--line2); margin: 0 6px; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text2); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover:not(:disabled) { background: var(--bg3); color: var(--text); border-color: var(--line2); }
.icon-btn:disabled { opacity: 0.32; cursor: default; }

.tabs { flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { position: relative; display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--text3); padding: 11px 12px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.tabs button svg { width: 15px; height: 15px; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.7); }
.tabs button[aria-selected="true"] svg { color: var(--accent); }
.tabs .badge { font: 600 10px/1 var(--font-mono); padding: 2px 5px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-2); }

.page-head { flex: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px 10px; }
.page-head .ph-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: var(--accent-soft); color: var(--accent-2); border: 1px solid var(--accent-line); }
.page-head .ph-icon svg { width: 18px; height: 18px; }
.page-head h1 { margin: 0; font: 800 22px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
.page-head p { margin: 3px 0 0; color: var(--text2); font-size: 12.5px; }
.page-head .ph-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.pages { flex: 1; min-height: 0; position: relative; }
.page { position: absolute; inset: 0; padding: 0 14px 14px; display: grid; gap: 12px; min-height: 0; }
.page-scroll { position: absolute; inset: 0; padding: 0 14px 18px; }

.statusbar { flex: none; height: 28px; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text3); background: var(--bg0); white-space: nowrap; overflow: hidden; }
.statusbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex: none; }
.statusbar .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(47, 211, 138, 0.6); }
.statusbar .item { display: inline-flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.statusbar .changes { color: var(--accent-2); }

/* ---------------------------------------------------------------- panels */
.panel { background: linear-gradient(180deg, rgba(255, 255, 255, 0.012), transparent 120px), var(--bg1); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 42px; }
.panel-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: var(--text); white-space: nowrap; }
.panel-head h2::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.7); }
.panel-head .count { font: 500 11px/1 var(--font-mono); color: var(--text3); }
.panel-head .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.panel-body { flex: 1; min-height: 0; padding: 12px; }
.panel-body.flush { padding: 0; }
.section { display: grid; gap: 12px; padding: 14px 14px 16px; border-bottom: 1px solid var(--line); }
.section:last-child { border-bottom: 0; }
.section > h3 { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 10.5px/1 var(--font-ui); letter-spacing: 0.13em; text-transform: uppercase; color: var(--text3); }
.section > p.explain { margin: -4px 0 0; font-size: 12px; color: var(--text2); line-height: 1.45; }

/* ---------------------------------------------------------------- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line2); background: var(--bg3); color: var(--text); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.btn:hover:not(:disabled) { background: var(--bg4); border-color: var(--text3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 4px 18px rgba(var(--accent-rgb), 0.28); }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text2); }
.btn.ghost:hover:not(:disabled) { background: var(--bg3); color: var(--text); }
.btn.small { padding: 5px 9px; font-size: 12px; }
.btn.big { padding: 12px 18px; font-size: 14px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.link { border: 0; background: none; padding: 0; color: var(--accent-2); font-weight: 600; font-size: 12px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

.field { display: grid; gap: 6px; }
.field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.field-head label, .field-head .lbl { font-weight: 600; font-size: 12.5px; color: var(--text); }
.field-help { font-size: 11.5px; color: var(--text3); line-height: 1.4; }
.pill { font: 500 11.5px/1 var(--font-mono); padding: 4px 7px; border-radius: 6px; background: var(--bg3); color: var(--text2); font-variant-numeric: tabular-nums; min-width: 54px; text-align: center; border: 1px solid transparent; }
.pill.changed { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent-line); }

.track { position: relative; height: 22px; }
.track input[type="range"] { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; height: 22px; cursor: pointer; }
.track input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--bg4) var(--fill, 0%)); }
.track input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5.5px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.15); }
.track input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--bg4); }
.track input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
.track input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
.mark { position: absolute; top: 15px; width: 1px; height: 7px; background: var(--text3); transform: translateX(-0.5px); pointer-events: none; }
.mark.pack { background: #5ec4ff; }
.marks-legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--text3); }
.marks-legend i { display: inline-block; width: 8px; height: 2px; margin-right: 5px; vertical-align: 3px; background: var(--text3); }
.marks-legend i.pack { background: #5ec4ff; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--bg0); border: 1px solid var(--line); border-radius: 9px; }
.seg.wrap { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
.seg button { display: grid; justify-items: center; align-content: center; gap: 4px; border: 0; background: transparent; color: var(--text3); padding: 6px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 600; min-height: 30px; }
.seg button:hover:not(:disabled) { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--bg3); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent-line); }
.seg button:disabled { opacity: 0.35; cursor: not-allowed; }
.seg .art { width: 28px; height: 16px; border-radius: 3px; background: #04060a; position: relative; overflow: hidden; border: 1px solid var(--line); }
.seg .art i { position: absolute; top: 0; bottom: 0; }

.colour-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.swatch-btn { position: relative; width: 34px; height: 28px; border-radius: 7px; border: 1px solid var(--line2); overflow: hidden; padding: 0; flex: none; }
.swatch-btn input { position: absolute; inset: -8px; width: 52px; height: 46px; opacity: 0; cursor: pointer; }
.swatch-btn span { position: absolute; inset: 0; }
.hex { width: 88px; background: var(--bg0); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: 12px/1 var(--font-mono); text-transform: uppercase; }
.quick { display: flex; gap: 5px; flex-wrap: wrap; }
.quick button { width: 17px; height: 17px; border-radius: 50%; border: 0; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16); padding: 0; }
.quick button:hover { transform: scale(1.15); }
.rgb-inputs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 30px; gap: 6px; align-items: center; }
.rgb-inputs label { display: flex; align-items: center; gap: 5px; background: var(--bg0); border: 1px solid var(--line); border-radius: 7px; padding: 0 7px; }
.rgb-inputs label i { width: 3px; height: 14px; border-radius: 2px; flex: none; }
.rgb-inputs input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 6px 0; font: 12px/1 var(--font-mono); outline: none; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.switch .txt { display: grid; gap: 1px; }
.switch .txt b { font-weight: 600; font-size: 12.5px; }
.switch .txt span { font-size: 11.5px; color: var(--text3); }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 34px; height: 20px; border-radius: 20px; background: var(--bg4); position: relative; cursor: pointer; transition: background 0.15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #c8d0dd; transition: transform 0.15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); background: #fff; }

.input, select.input { width: 100%; background: var(--bg0); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; min-width: 0; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg0); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
.search svg { width: 14px; height: 14px; color: var(--text3); flex: none; }
.search input { flex: 1; border: 0; background: transparent; padding: 7px 0; outline: none; min-width: 0; font-size: 12.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text2); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; }
.chip .n { font: 500 10.5px/1 var(--font-mono); color: var(--text3); }
.chip:hover { color: var(--text); border-color: var(--text3); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] .n { color: rgba(255, 255, 255, 0.75); }

.note { font-size: 12px; line-height: 1.45; padding: 8px 10px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); border-left: 3px solid var(--warn); color: var(--text2); }
.note.info { border-left-color: var(--accent); }
.note.bad { border-left-color: var(--bad); }
.note.ok { border-left-color: var(--ok); }
.tip { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: var(--text2); line-height: 1.45; }
.tip svg { width: 16px; height: 16px; color: var(--accent-2); flex: none; margin-top: 1px; }

/* ---------------------------------------------------------------- lists */
.list-group { padding: 6px 8px 10px; }
.list-group > h4 { margin: 8px 6px 6px; font: 600 10px/1 var(--font-ui); letter-spacing: 0.13em; text-transform: uppercase; color: var(--text3); }
.card-list { display: grid; gap: 4px; }
.tpl { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 6px; text-align: left; color: var(--text); }
.tpl:hover { background: var(--bg2); border-color: var(--line); }
.tpl.on { background: var(--accent-soft); border-color: var(--accent-line); }
.tpl .thumb { width: 74px; height: 38px; border-radius: 6px; background: #04060a; overflow: hidden; border: 1px solid var(--line); position: relative; }
.tpl .thumb canvas { width: 100%; height: 100%; display: block; }
.tpl .thumb .fx { position: absolute; inset: 0; display: grid; place-items: center; }
.tpl .thumb .fx svg { width: 24px; height: 24px; }
.tpl .nm { font-weight: 600; font-size: 12.5px; line-height: 1.2; }
.tpl .sb { font-size: 11px; color: var(--text3); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl .from { font-size: 10.5px; color: var(--accent-2); }

/* ---------------------------------------------------------------- viewport */
.viewport { position: relative; flex: 1; min-height: 0; background: #03050a; border-radius: 0 0 var(--r) var(--r); overflow: hidden; }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vp-hud { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 20px); pointer-events: none; }
.hud-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 8px; font: 500 11px/1 var(--font-mono); color: #c9d2e3; background: rgba(6, 9, 15, 0.72); border: 1px solid rgba(201, 210, 227, 0.12); border-radius: 7px; backdrop-filter: blur(6px); }
.hud-chip b { color: #fff; font-weight: 500; }
.hud-chip .sw { width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25); }
.vp-note { position: absolute; right: 10px; top: 10px; font-size: 10.5px; color: rgba(201, 210, 227, 0.45); pointer-events: none; }
.vp-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mini-seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--bg0); border: 1px solid var(--line); border-radius: 7px; }
.mini-seg button { border: 0; background: transparent; color: var(--text3); padding: 4px 8px; border-radius: 5px; font-size: 11.5px; font-weight: 600; }
.mini-seg button[aria-pressed="true"] { background: var(--bg3); color: var(--text); }
.mini-toggle { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--bg0); color: var(--text3); border-radius: 7px; padding: 4px 8px; font-size: 11.5px; font-weight: 600; }
.mini-toggle svg { width: 13px; height: 13px; }
.mini-toggle[aria-pressed="true"] { color: var(--accent-2); border-color: var(--accent-line); background: var(--accent-soft); }
.fire-btn { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--accent); color: var(--on-accent); padding: 5px 10px; border-radius: 7px; font-weight: 700; font-size: 12px; }
.fire-btn svg { width: 14px; height: 14px; }
.fire-btn kbd { background: rgba(0, 0, 0, 0.18); border-color: rgba(255, 255, 255, 0.25); color: #fff; }

/* tracer sheet */
.sheets { display: flex; gap: 20px; height: 100%; align-items: stretch; }
.sheet { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sheet-title { font-size: 11.5px; color: var(--text2); display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
.sheet-title .mono { color: var(--text3); font-size: 10.5px; }
.frames { flex: 1; display: flex; gap: 6px; min-height: 0; }
.frame { display: flex; flex-direction: column; gap: 4px; align-items: center; min-height: 0; }
.frame canvas { flex: 1; min-height: 0; width: 40px; border-radius: 4px; border: 1px solid var(--line); image-rendering: pixelated; background: repeating-conic-gradient(#121826 0% 25%, #0b1019 0% 50%) 0 0 / 10px 10px; }
.frame span { font: 10px/1 var(--font-mono); color: var(--text3); white-space: nowrap; }
.frame.beam span { color: var(--accent-2); }
.sheet-empty { display: grid; place-items: center; text-align: center; color: var(--text3); font-size: 11.5px; width: 190px; border: 1px dashed var(--line2); border-radius: 8px; padding: 10px; }
.sheet-note { align-self: center; max-width: 32ch; color: var(--text3); font-size: 11.5px; line-height: 1.5; }

/* hit map */
.hitmap { display: grid; grid-template-columns: 104px repeat(5, minmax(0, 1fr)); gap: 6px; align-content: start; }
.hm-col, .hm-row { display: flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--text2); border-radius: 6px; padding: 5px 7px; font-size: 12px; font-weight: 600; text-align: left; min-width: 0; }
.hm-col svg, .hm-row svg { width: 15px; height: 15px; flex: none; color: var(--text3); }
.hm-col:hover, .hm-row:hover { background: var(--bg2); color: var(--text); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>/* core/bfxcore.js */
/* BloodFX Maker core: RPF7 archives, RSC7 resources, core.ypt tracer patching and texture drawing.
   Works in browsers and in Node. Call setZlib(pako) (or any object with inflateRaw/deflateRaw) first. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.BfxCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  let zlib = null;
  function setZlib(z) { zlib = z; }

  const RPF7 = 0x52504637;
  const ENC_OPEN = 0x4E45504F;
  const DIR_MARK = 0x7FFFFF00;
  const RSC7 = 0x37435352;
  const BLOCK = 512;

  const dv = (u8) => new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

  function joaat(str) {
    let h = 0;
    const s = str.toLowerCase();
    for (let i = 0; i < s.length; i++) {
      h = (h + s.charCodeAt(i)) >>> 0;
      h = (h + (h << 10)) >>> 0;
      h = (h ^ (h >>> 6)) >>> 0;
    }
    h = (h + (h << 3)) >>> 0;
    h = (h ^ (h >>> 11)) >>> 0;
    h = (h + (h << 15)) >>> 0;
    return h >>> 0;
  }

  function cstring(u8, off) {
    let end = off;
    while (end < u8.length && u8[end] !== 0) end++;
    let s = '';
    for (let i = off; i < end; i++) s += String.fromCharCode(u8[i]);
    return s;
  }

  // ---------------------------------------------------------------- RPF7

  function readRpf(bytes, path) {
    path = path || 'archive.rpf';
    if (bytes.length < 16) throw new Error(`${path} is too small to be an RPF archive`);
    const d = dv(bytes);
    if (d.getUint32(0, true) !== RPF7) throw new Error(`${path} isn't a GTA V .rpf file`);
    const count = d.getUint32(4, true);
    const namesLen = d.getUint32(8, true);
    const encryption = d.getUint32(12, true);
    if (encryption !== ENC_OPEN && encryption !== 0) {
      throw new Error(`${path} is an encrypted RPF. Open it in OpenIV, switch it to "OpenIV" (unencrypted) and save, then try again.`);
    }
    const namesStart = 16 + count * 16;
    if (namesStart + namesLen > bytes.length) throw new Error(`${path} has a damaged header`);
    const names = bytes.subarray(namesStart, namesStart + namesLen);
    const raw = [];
    for (let i = 0; i < count; i++) {
      const o = 16 + i * 16;
      const second = d.getUint32(o + 4, true);
      let e;
      if (second === DIR_MARK) {
        e = { kind: 'dir', nameOff: d.getUint32(o, true), first: d.getUint32(o + 8, true), count: d.getUint32(o + 12, true) };
      } else if ((second & 0x80000000) === 0) {
        const lo = d.getUint32(o, true);
        const csize = (lo >>> 16) | ((second & 0xFF) << 16);
        const offset = second >>> 8;
        const usize = d.getUint32(o + 8, true);
        const encrypted = d.getUint32(o + 12, true);
        const len = csize || usize;
        e = { kind: 'bin', nameOff: lo & 0xFFFF, csize, usize, encrypted,
              stored: slice(bytes, offset * BLOCK, len, path) };
      } else {
        const nameOff = d.getUint16(o, true);
        let size = bytes[o + 2] | (bytes[o + 3] << 8) | (bytes[o + 4] << 16);
        const offset = (bytes[o + 5] | (bytes[o + 6] << 8) | (bytes[o + 7] << 16)) & 0x7FFFFF;
        if (size === 0xFFFFFF) {
          const h = offset * BLOCK;
          size = (bytes[h + 7] | (bytes[h + 14] << 8) | (bytes[h + 5] << 16) | (bytes[h + 2] << 24)) >>> 0;
        }
        e = { kind: 'rsc', nameOff, sysf: d.getUint32(o + 8, true), gfxf: d.getUint32(o + 12, true),
              stored: slice(bytes, offset * BLOCK, size, path) };
      }
      e.name = cstring(names, e.nameOff);
      raw.push(e);
    }
    if (!raw.length || raw[0].kind !== 'dir') throw new Error(`${path} has no root folder`);
    const seen = new Set();
    function build(i, prefix) {
      if (seen.has(i)) throw new Error(`${path} has a looping folder table`);
      seen.add(i);
      const e = raw[i];
      const node = { kind: 'dir', name: e.name, children: [] };
      for (let j = e.first; j < e.first + e.count; j++) {
        const c = raw[j];
        if (!c) throw new Error(`${path} has a broken folder table`);
        const p = prefix + c.name;
        if (c.kind === 'dir') {
          node.children.push(build(j, p + '/'));
        } else {
          const f = { kind: c.kind, name: c.name, stored: c.stored };
          if (c.kind === 'bin') {
            f.csize = c.csize; f.usize = c.usize; f.encrypted = c.encrypted;
            if (!c.csize && !c.encrypted && /\.rpf$/i.test(c.name)) {
              try { f.rpf = readRpf(c.stored, `${path}/${p}`); } catch { f.rpf = null; }
            }
          } else {
            f.sysf = c.sysf; f.gfxf = c.gfxf;
          }
          node.children.push(f);
        }
      }
      return node;
    }
    return { encryption, root: build(0, '') };
  }

  function slice(bytes, start, len, path) {
    if (start + len > bytes.length) throw new Error(`${path} is cut short (a file points past the end)`);
    return bytes.subarray(start, start + len);
  }

  function ordinal(a, b) {
    const n = Math.min(a.length, b.length);
    for (let i = 0; i < n; i++) {
      const d = a.charCodeAt(i) - b.charCodeAt(i);
      if (d) return d;
    }
    return a.length - b.length;
  }

  function writeRpf(archive) {
    const entries = [archive.root];
    const queue = [archive.root];
    while (queue.length) {
      const dir = queue.shift();
      const kids = dir.children.slice().sort((a, b) => ordinal(a.name, b.name));
      dir._first = entries.length;
      dir._count = kids.length;
      for (const k of kids) {
        entries.push(k);
        if (k.kind === 'dir') queue.push(k);
      }
    }
    const nameOffsets = new Map();
    const nameBytes = [];
    for (const e of entries) {
      if (nameOffsets.has(e.name)) continue;
      nameOffsets.set(e.name, nameBytes.length);
      for (let i = 0; i < e.name.length; i++) nameBytes.push(e.name.charCodeAt(i) & 0xFF);
      nameBytes.push(0);
    }
    while (nameBytes.length % 16) nameBytes.push(0);
    const headerLen = 16 + entries.length * 16 + nameBytes.length;
    let block = Math.ceil(headerLen / BLOCK);
    const payloads = [];
    for (const e of entries) {
      if (e.kind === 'dir') continue;
      let data = e.stored;
      if (e.kind === 'bin' && e.rpf) {
        data = writeRpf(e.rpf);
        e.csize = 0; e.usize = data.length; e.encrypted = 0;
      }
      if (e.kind === 'rsc' && data.length >= 0xFFFFFF) throw new Error(`${e.name} is too big for an RPF (16 MB limit per resource)`);
      if (e.kind === 'bin' && e.csize > 0xFFFFFF) throw new Error(`${e.name} is too big`);
      e._offset = block;
      e._data = data;
      payloads.push(e);
      block += Math.max(1, Math.ceil(data.length / BLOCK));
    }
    const out = new Uint8Array(block * BLOCK);
    const d = dv(out);
    d.setUint32(0, RPF7, true);
    d.setUint32(4, entries.length, true);
    d.setUint32(8, nameBytes.length, true);
    d.setUint32(12, archive.encryption === 0 ? 0 : ENC_OPEN, true);
    entries.forEach((e, i) => {
      const o = 16 + i * 16;
      const nameOff = nameOffsets.get(e.name);
      if (e.kind === 'dir') {
        d.setUint32(o, nameOff, true);
        d.setUint32(o + 4, DIR_MARK, true);
        d.setUint32(o + 8, e._first, true);
        d.setUint32(o + 12, e._count, true);
      } else if (e.kind === 'bin') {
        if (nameOff > 0xFFFF) throw new Error('Too many file names in one archive');
        d.setUint32(o, (nameOff | ((e.csize & 0xFFFF) << 16)) >>> 0, true);
        d.setUint32(o + 4, (((e.csize >>> 16) & 0xFF) | (e._offset << 8)) >>> 0, true);
        d.setUint32(o + 8, e.usize >>> 0, true);
        d.setUint32(o + 12, e.encrypted ? 1 : 0, true);
      } else {
        if (nameOff > 0xFFFF) throw new Error('Too many file names in one archive');
        const size = e._data.length;
        d.setUint16(o, nameOff, true);
        out[o + 2] = size & 0xFF; out[o + 3] = (size >>> 8) & 0xFF; out[o + 4] = (size >>> 16) & 0xFF;
        out[o + 5] = e._offset & 0xFF; out[o + 6] = (e._offset >>> 8) & 0xFF; out[o + 7] = ((e._offset >>> 16) & 0x7F) | 0x80;
        d.setUint32(o + 8, e.sysf >>> 0, true);
        d.setUint32(o + 12, e.gfxf >>> 0, true);
      }
    });
    out.set(nameBytes, 16 + entries.length * 16);
    for (const e of payloads) out.set(e._data, e._offset * BLOCK);
    for (const e of entries) { delete e._first; delete e._count; delete e._offset; delete e._data; }
    return out;
  }

  // Every file in the archive (descending into nested .rpf files), with its folder path.
  function listFiles(archive, prefix, out) {
    out = out || [];
    prefix = prefix || '';
    (function walk(dir, p) {
      for (const c of dir.children) {
        const path = p + c.name;
        if (c.kind === 'dir') walk(c, path + '/');
        else {
          out.push({ path, node: c });
          if (c.rpf) listFiles(c.rpf, path + '/', out);
        }
      }
    })(archive.root, prefix);
    return out;
  }

  function readBinary(node) {
    if (node.kind !== 'bin') throw new Error(`${node.name} is not a plain file`);
    if (node.encrypted) throw new Error(`${node.name} is encrypted inside the archive`);
    return node.csize ? zlib.inflateRaw(node.stored) : node.stored;
  }

  // ---------------------------------------------------------------- RSC7

  function pageSize(flags) {
    const counts = ((flags >>> 27) & 1) + (((flags >>> 26) & 1) << 1) + (((flags >>> 25) & 1) << 2) +
      (((flags >>> 24) & 1) << 3) + (((flags >>> 17) & 0x7F) << 4) + (((flags >>> 11) & 0x3F) << 5) +
      (((flags >>> 7) & 0xF) << 6) + (((flags >>> 5) & 0x3) << 7) + (((flags >>> 4) & 1) << 8);
    return (0x200 << (flags & 0xF)) * counts;
  }

  // Accepts a resource as stored in an RPF or as a standalone .ypt file (both start with the RSC7 header).
  function openResource(stored, sysf, gfxf) {
    const d = dv(stored);
    let version, body;
    if (stored.length >= 16 && d.getUint32(0, true) === RSC7) {
      version = d.getUint32(4, true);
      sysf = d.getUint32(8, true);
      gfxf = d.getUint32(12, true);
      body = stored.subarray(16);
    } else {
      if (sysf === undefined) throw new Error('This is not a GTA V resource (no RSC7 header)');
      version = (((sysf >>> 28) & 0xF) << 4) | ((gfxf >>> 28) & 0xF);
      body = stored.subarray(16);
    }
    const data = zlib.inflateRaw(body);
    const sysSize = pageSize(sysf);
    const gfxSize = pageSize(gfxf);
    if (data.length !== sysSize + gfxSize) {
      throw new Error(`Resource size mismatch (unpacked ${data.length} bytes, header says ${sysSize + gfxSize})`);
    }
    return { version, sysf, gfxf, data, sysSize, gfxSize };
  }

  function packResource(res, level, body) {
    body = body || zlib.deflateRaw(res.data, { level: level === undefined ? 6 : level });
    const out = new Uint8Array(16 + body.length);
    const d = dv(out);
    d.setUint32(0, RSC7, true);
    d.setUint32(4, res.version, true);
    d.setUint32(8, res.sysf >>> 0, true);
    d.setUint32(12, res.gfxf >>> 0, true);
    out.set(body, 16);
    return out;
  }

  // ---------------------------------------------------------------- core.ypt navigation

  const BEHAVIOUR_COLOUR = 0x164AEA72;
  const FMT = { DXT1: 0x31545844, DXT3: 0x33545844, DXT5: 0x35545844, BC7: 0x20374342, A8R8G8B8: 21 };
  const FMT_NAME = Object.fromEntries(Object.entries(FMT).map(([k, v]) => [v, k]));

  class Ypt {
    constructor(res) {
      this.res = res;
      this.u8 = res.data;
      this.d = dv(res.data);
    }
    u32(o) { return this.d.getUint32(o, true); }
    u16(o) { return this.d.getUint16(o, true); }
    f32(o) { return this.d.getFloat32(o, true); }
    setF32(o, v) { this.d.setFloat32(o, v, true); }
    setU32(o, v) { this.d.setUint32(o, v >>> 0, true); }
    ptr(o) {
      const lo = this.u32(o), hi = this.u32(o + 4);
      if (lo === 0 && hi === 0) return -1;
      if (hi !== 0) throw new Error(`Unexpected pointer at 0x${o.toString(16)}`);
      const tag = lo >>> 28, off = lo & 0x0FFFFFFF;
      let abs;
      if (tag === 5) abs = off;
      else if (tag === 6) abs = this.res.sysSize + off;
      else throw new Error(`Bad pointer 0x${lo.toString(16)} at 0x${o.toString(16)}`);
      if (abs >= this.u8.length) throw new Error(`Pointer 0x${lo.toString(16)} points outside the file`);
      return abs;
    }
    str(o) { const p = this.ptr(o); return p < 0 ? '' : cstring(this.u8, p); }
    // ResourcePointerList64 / ResourceSimpleList64: pointer at o, u16 count at o + 8
    pointers(o) {
      const base = this.ptr(o), n = this.u16(o + 8);
      const out = [];
      for (let i = 0; i < n; i++) out.push(this.ptr(base + i * 8));
      return out;
    }
    simple(o, stride) {
      const base = this.ptr(o), n = this.u16(o + 8);
      const out = [];
      for (let i = 0; i < n; i++) out.push(base + i * stride);
      return out;
    }
    rules(dictPtrOff, nameOff) {
      const dict = this.ptr(dictPtrOff);
      const map = new Map();
      for (const p of this.pointers(dict + 0x30)) if (p >= 0) map.set(this.str(p + nameOff), p);
      return map;
    }
    effectRules() { return this._eff || (this._eff = this.rules(0x48, 0x20)); }
    emitterRules() { return this._emi || (this._emi = this.rules(0x50, 0x20)); }
    particleRules() { return this._par || (this._par = this.rules(0x38, 0x120)); }
    textures() {
      if (this._tex) return this._tex;
      const dict = this.ptr(0x20);
      const map = new Map();
      if (dict >= 0) for (const p of this.pointers(dict + 0x30)) if (p >= 0) map.set(this.str(p + 0x28), p);
      return (this._tex = map);
    }
    keyframes(kfp) {
      return this.simple(kfp + 0x70, 0x20).map((o) => ({
        off: o,
        t: [this.f32(o), this.f32(o + 4), this.f32(o + 8), this.f32(o + 12)],
        v: [this.f32(o + 16), this.f32(o + 20), this.f32(o + 24), this.f32(o + 28)],
      }));
    }
    behaviours(rule) {
      return this.pointers(rule + 0x128).map((p) => ({ off: p, type: this.u32(p + 8) }));
    }
  }

  function readEmitter(y, p) {
    const em = {
      off: p,
      emitterRule: y.str(p + 0x30),
      particleRule: y.str(p + 0x38),
      rate: [y.f32(p + 0x50), y.f32(p + 0x54)],
      zoom: [y.f32(p + 0x58), y.f32(p + 0x5C)],
      tint: [y.u32(p + 0x60), y.u32(p + 0x64)],
      lodSize: null,
    };
    const evo = y.ptr(p + 0x18);
    if (evo >= 0) {
      const want = joaat('ptxEmitterRule:m_sizeScalarKFP');
      for (const item of y.simple(evo + 0x10, 24)) {
        if (y.u32(item + 0x10) !== want) continue;
        for (const ek of y.simple(item, 0x30)) {
          if (y.u8[ek + 0x24] !== 1) continue;
          const kfs = y.simple(ek, 0x20);
          if (kfs.length) em.lodSize = { offs: kfs, value: [y.f32(kfs[0] + 16), y.f32(kfs[0] + 20), y.f32(kfs[0] + 24), y.f32(kfs[0] + 28)] };
        }
      }
    }
    return em;
  }

  function readColour(y, rule) {
    const b = y.behaviours(rule).find((x) => x.type === BEHAVIOUR_COLOUR);
    if (!b) return null;
    return {
      off: b.off,
      canTint: y.u8[b.off + 0x1E6],
      rgbaMin: y.keyframes(b.off + 0x30),
      rgbaMax: y.keyframes(b.off + 0xC0),
      emissive: y.keyframes(b.off + 0x150),
    };
  }

  function readLife(y, emitterRule) {
    if (emitterRule < 0) return null;
    const want = joaat('ptxEmitterRule:m_particleLifeKFP');
    for (let i = 0; i < 10; i++) {
      const kfp = emitterRule + 0x78 + i * 0x90;
      if (y.u32(kfp + 0x68) === want) return { kfp, keyframes: y.keyframes(kfp) };
    }
    return null;
  }

  function readTexture(y, name) {
    const p = y.textures().get(name);
    if (p === undefined) return null;
    const t = {
      off: p, name,
      width: y.u16(p + 0x50), height: y.u16(p + 0x52), stride: y.u16(p + 0x56),
      format: y.u32(p + 0x58), levels: y.u8[p + 0x5D], data: y.ptr(p + 0x70),
    };
    t.formatName = FMT_NAME[t.format] || `0x${t.format.toString(16)}`;
    let len = 0, l = t.stride * t.height;
    for (let i = 0; i < t.levels; i++) { len += l; l = Math.floor(l / 4); }
    t.dataLength = len;
    if (t.data < y.res.sysSize || t.data + len > y.u8.length) throw new Error(`Texture ${name} data is out of range`);
    return t;
  }

  // Everything the maker shows and changes for the standard gun tracer.
  function readTracer(y) {
    const eff = y.effectRules().get('bullet_tracer');
    if (eff === undefined) throw new Error('No bullet_tracer effect in this core.ypt');
    const emitters = y.pointers(eff + 0x38).filter((p) => p >= 0).map((p) => readEmitter(y, p));
    const beam = emitters.find((e) => e.particleRule === 'bullet_tracer');
    const smoke = emitters.find((e) => e.particleRule === 'bullet_tracer_smoke');
    if (!beam) throw new Error('bullet_tracer has no tracer emitter');
    const pr = y.particleRules();
    const beamRule = pr.get('bullet_tracer');
    const smokeRule = pr.get('bullet_tracer_smoke');
    const out = {
      effect: { off: eff, duration: [y.f32(eff + 0x78), y.f32(eff + 0x7C)], rate: [y.f32(eff + 0x80), y.f32(eff + 0x84)] },
      beam,
      smoke: smoke || null,
      beamColour: beamRule === undefined ? null : readColour(y, beamRule),
      smokeColour: smokeRule === undefined ? null : readColour(y, smokeRule),
      beamFrames: beamRule === undefined ? null : [y.u32(beamRule + 0x118), y.u32(beamRule + 0x11C)],
      life: readLife(y, y.emitterRules().get('bullet_tracer') ?? -1),
      smokeLife: readLife(y, y.emitterRules().get('bullet_tracer_smoke') ?? -1),
      texture: readTexture(y, 'ptfx_bullet_tracer'),
    };
    return out;
  }

  // ---------------------------------------------------------------- patching

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function argb(hex, alpha) {
    const n = parseInt(hex.replace('#', ''), 16);
    return ((((alpha === undefined ? 255 : alpha) & 0xFF) << 24) | n) >>> 0;
  }

  function setRgb(y, keyframes, rgb) {
    for (const k of keyframes) {
      y.setF32(k.off + 16, rgb[0]);
      y.setF32(k.off + 20, rgb[1]);
      y.setF32(k.off + 24, rgb[2]);
    }
  }

  // settings: any subset of
  //   duration [min,max] s, effectRate [min,max], beamRate [min,max], zoom [min,max], tint '#rrggbb',
  //   farSize number, glow number, life [min,max] s, beamRgb [r,g,b] 0-1, smokeRgb [r,g,b] 0-1,
  //   texture { beam: {colour, width, style}, smoke: {mode, colour, width} }
  function applyTracer(y, s) {
    const t = readTracer(y);
    const log = [];
    if (s.duration) {
      y.setF32(t.effect.off + 0x78, clamp(s.duration[0], 0.01, 30));
      y.setF32(t.effect.off + 0x7C, clamp(s.duration[1], 0.01, 30));
      log.push('effect duration');
    }
    if (s.effectRate) {
      y.setF32(t.effect.off + 0x80, clamp(s.effectRate[0], 0.01, 10));
      y.setF32(t.effect.off + 0x84, clamp(s.effectRate[1], 0.01, 10));
      log.push('effect speed');
    }
    if (s.beamRate) {
      y.setF32(t.beam.off + 0x50, clamp(s.beamRate[0], 0.01, 10));
      y.setF32(t.beam.off + 0x54, clamp(s.beamRate[1], 0.01, 10));
      log.push('beam speed');
    }
    if (s.zoom) {
      y.setF32(t.beam.off + 0x58, clamp(s.zoom[0], 0.05, 20));
      y.setF32(t.beam.off + 0x5C, clamp(s.zoom[1], 0.05, 20));
      log.push('beam thickness');
    }
    if (s.tint) {
      y.setU32(t.beam.off + 0x60, argb(s.tint));
      y.setU32(t.beam.off + 0x64, argb(s.tint));
      log.push('beam tint');
    }
    if (s.smokeTint && t.smoke) {
      y.setU32(t.smoke.off + 0x60, argb(s.smokeTint));
      y.setU32(t.smoke.off + 0x64, argb(s.smokeTint));
      log.push('smoke tint');
    }
    if (s.farSize !== undefined && t.beam.lodSize) {
      const v = clamp(s.farSize, 1, 5000);
      for (const o of t.beam.lodSize.offs) { y.setF32(o + 16, v); y.setF32(o + 20, v); y.setF32(o + 24, v); }
      log.push('far-away size');
    }
    if (s.glow !== undefined && t.beamColour) {
      const g = clamp(s.glow, 0, 200);
      for (const k of t.beamColour.emissive) { y.setF32(k.off + 16, g); y.setF32(k.off + 20, g * 16 / 15); }
      log.push('glow');
    }
    if (s.life && t.life) {
      for (const k of t.life.keyframes) {
        y.setF32(k.off + 16, clamp(s.life[0], 0.005, 10));
        y.setF32(k.off + 20, clamp(s.life[1], 0.005, 10));
      }
      log.push('beam life');
    }
    if (s.beamRgb && t.beamColour) {
      setRgb(y, t.beamColour.rgbaMin, s.beamRgb);
      setRgb(y, t.beamColour.rgbaMax, s.beamRgb);
      log.push('beam colour multiplier');
    }
    if (s.smokeRgb && t.smokeColour) {
      setRgb(y, t.smokeColour.rgbaMin, s.smokeRgb);
      setRgb(y, t.smokeColour.rgbaMax, s.smokeRgb);
      log.push('smoke colour multiplier');
    }
    if (s.muzzle && s.muzzle.names && s.muzzle.names.length) {
      recolourRules(y, s.muzzle.names, s.muzzle.rgb, s.muzzle.emissive);
      log.push(`${s.muzzle.names.length} muzzle flashes`);
    }
    if (s.texture) {
      if (!t.texture) throw new Error('This core.ypt has no ptfx_bullet_tracer texture to redraw');
      writeTracerTexture(y, t.texture, s.texture);
      log.push('tracer texture');
    }
    return log;
  }

  // ---------------------------------------------------------------- bulk colour edits and pack contents

  // Particle rules whose name contains `match` and that have colour keyframes (muzzle flashes are "muz").
  function colourRules(y, match) {
    const want = String(match || '').toLowerCase();
    const out = [];
    for (const [name, rule] of y.particleRules()) {
      if (want && !name.toLowerCase().includes(want)) continue;
      const c = readColour(y, rule);
      if (!c || !(c.rgbaMin.length + c.rgbaMax.length)) continue;
      const k = c.rgbaMax[0] || c.rgbaMin[0];
      out.push({ name, keyframes: c.rgbaMin.length + c.rgbaMax.length, now: k.v.slice(0, 3), emissive: c.emissive[0] ? c.emissive[0].v[0] : null });
    }
    return out.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  }

  // Recolours the named particle rules to `rgb` (0-1). Each keyframe keeps its own brightness and alpha, so a flash
  // that fades still fades. Sets their glow too when `emissive` is a number.
  function recolourRules(y, names, rgb, emissive) {
    const pick = new Set(names);
    let count = 0;
    const tint = (keyframes) => {
      for (const k of keyframes) {
        const m = Math.max(k.v[0], k.v[1], k.v[2]);
        setRgb(y, [k], rgb.map((c) => c * m));
      }
    };
    for (const [name, rule] of y.particleRules()) {
      if (!pick.has(name)) continue;
      const c = readColour(y, rule);
      if (!c) continue;
      tint(c.rgbaMin);
      tint(c.rgbaMax);
      if (typeof emissive === 'number') for (const k of c.emissive) { y.setF32(k.off + 16, emissive); y.setF32(k.off + 20, emissive); }
      count++;
    }
    return count;
  }

  // Names and counts for the pack explorer.
  function packContents(y) {
    const effects = [...y.effectRules().entries()].map(([name, p]) => ({
      name, loops: y.d.getInt32(p + 0x50, true), duration: Math.max(y.f32(p + 0x78), y.f32(p + 0x7C)), emitters: y.u16(p + 0x40),
    }));
    const textures = [];
    for (const name of y.textures().keys()) {
      try { textures.push(readTexture(y, name)); } catch { textures.push({ name, broken: true }); }
    }
    const byName = (a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    return { effects: effects.sort(byName), emitters: y.emitterRules().size, particles: y.particleRules().size, textures: textures.sort(byName) };
  }

  // ---------------------------------------------------------------- tracer texture drawing

  function hexRgb(hex) {
    const n = parseInt(String(hex || '#ffffff').replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Per-row trims for a ragged smoke edge: 0-2 pixels, in runs of 2-6 rows, seeded so a sheet always draws the same.
  function raggedEdge(seed, rows) {
    let state = seed >>> 0;
    const next = () => { state = (Math.imul(state, 1664525) + 1013904223) >>> 0; return state / 4294967296; };
    const out = new Uint8Array(rows);
    for (let y = 0; y < rows;) {
      const r = next();
      const trim = r < 0.5 ? 0 : r < 0.88 ? 1 : 2;
      const run = 2 + Math.floor(next() * 5);
      for (let k = 0; k < run && y < rows; k++) out[y++] = trim;
    }
    return out;
  }

  // The tracer sheet is 4 frames side by side: frames 0-2 animate the smoke trail, frame 3 is the beam.
  function drawTracerSheet(w, h, opts) {
    const px = new Uint8Array(w * h * 4);
    const frameW = w / 4;
    const scale = w / 128;
    const put = (x, y, rgb) => {
      if (x < 0 || x >= w) return;
      const i = (y * w + x) * 4;
      px[i] = rgb[0]; px[i + 1] = rgb[1]; px[i + 2] = rgb[2]; px[i + 3] = 255;
    };
    // A second colour fades the beam or smoke along its length (the sheet's height runs along the bullet's path).
    const along = (a, b, flip) => {
      const c0 = hexRgb(a), c1 = b ? hexRgb(b) : null;
      return (y) => {
        if (!c1) return c0;
        const t = h > 1 ? (flip ? 1 - y / (h - 1) : y / (h - 1)) : 0;
        return [0, 1, 2].map((k) => Math.round(c0[k] + (c1[k] - c0[k]) * t));
      };
    };
    const beam = opts.beam || {};
    const style = beam.style || 'solid';
    if (style !== 'none') {
      const colourAt = along(beam.colour, beam.colour2, beam.flip);
      const core = hexRgb(beam.core || '#ffffff');
      const width = Math.max(1, Math.round((beam.width || 3) * scale));
      const centre = Math.floor(frameW * 3 + frameW / 2 - 1);
      const x0 = centre - Math.floor((width - 1) / 2);
      // a thin core: a wide white centre washes the whole beam out to white in game
      const coreW = width <= 5 ? 1 : Math.round(width / 4);
      const coreX0 = x0 + Math.floor((width - coreW) / 2);
      const lineW = Math.max(1, Math.floor(width / 3));
      for (let y = 0; y < h; y++) {
        const colour = colourAt(y);
        for (let x = x0; x < x0 + width; x++) {
          if (style === 'solid') put(x, y, colour);
          else if (style === 'neon') put(x, y, x >= coreX0 && x < coreX0 + coreW ? core : colour);
          else if (style === 'twin') { if (x < x0 + lineW || x >= x0 + width - lineW) put(x, y, colour); }
        }
      }
    }
    const smoke = opts.smoke || {};
    if (smoke.mode === 'line') {
      // A crisp line with one ragged edge, like the pink tracers pack. Each smoke frame gets its own raggedness,
      // so the trail flickers like smoke as the game steps through the frames.
      const colourAt = along(smoke.colour, smoke.colour2, smoke.flip);
      const width = Math.max(1, Math.round((smoke.width || 4) * scale));
      for (let f = 0; f < 3; f++) {
        const trims = raggedEdge(0x51ED + f * 977, h);
        const left = Math.floor(frameW * f + frameW / 2) - Math.floor((width + 1) / 2);
        for (let y = 0; y < h; y++) {
          const rowW = Math.max(1, width + 1 - trims[y]);
          const colour = colourAt(y);
          for (let x = left; x < left + rowW; x++) put(x, y, colour);
        }
      }
    } else if (smoke.mode === 'wavy') {
      const colourAt = along(smoke.colour, smoke.colour2, smoke.flip);
      const width = Math.max(1, Math.round((smoke.width || 3) * scale));
      for (let f = 0; f < 3; f++) {
        const centre = Math.floor(frameW * f + frameW / 2 - 1);
        for (let y = 0; y < h; y++) {
          const wave = Math.round(Math.sin((y / h) * Math.PI * 6 + f * 2.1) * 3 * scale);
          const x0 = centre - Math.floor((width - 1) / 2) + wave;
          const colour = colourAt(y);
          for (let x = x0; x < x0 + width; x++) put(x, y, colour);
        }
      }
    }
    return px;
  }

  // Halve an RGBA image; colour is averaged over visible pixels so edges keep their colour.
  function halve(src, w, h) {
    const nw = Math.max(1, w >> 1), nh = Math.max(1, h >> 1);
    const out = new Uint8Array(nw * nh * 4);
    for (let y = 0; y < nh; y++) {
      for (let x = 0; x < nw; x++) {
        let r = 0, g = 0, b = 0, a = 0, n = 0;
        for (let dy = 0; dy < 2; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            const sx = Math.min(w - 1, x * 2 + dx), sy = Math.min(h - 1, y * 2 + dy);
            const i = (sy * w + sx) * 4;
            const pa = src[i + 3];
            r += src[i] * pa; g += src[i + 1] * pa; b += src[i + 2] * pa; a += pa; n++;
          }
        }
        const o = (y * nw + x) * 4;
        if (a > 0) { out[o] = Math.round(r / a); out[o + 1] = Math.round(g / a); out[o + 2] = Math.round(b / a); }
        out[o + 3] = Math.round(a / n);
      }
    }
    return { px: out, w: nw, h: nh };
  }

  const to565 = (c) => ((Math.round(c[0] * 31 / 255) << 11) | (Math.round(c[1] * 63 / 255) << 5) | Math.round(c[2] * 31 / 255));
  const from565 = (v) => [((v >> 11) & 31) * 255 / 31, ((v >> 5) & 63) * 255 / 63, (v & 31) * 255 / 31];
  const dist2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;

  function blockPixels(img, bx, by) {
    const out = [];
    for (let y = 0; y < 4; y++) {
      for (let x = 0; x < 4; x++) {
        const sx = bx * 4 + x, sy = by * 4 + y;
        if (sx >= img.w || sy >= img.h) { out.push(null); continue; }
        const i = (sy * img.w + sx) * 4;
        out.push([img.px[i], img.px[i + 1], img.px[i + 2], img.px[i + 3]]);
      }
    }
    return out;
  }

  function endpoints(colours) {
    let best = [colours[0], colours[0]], bestD = -1;
    for (let i = 0; i < colours.length; i++) {
      for (let j = i; j < colours.length; j++) {
        const d = dist2(colours[i], colours[j]);
        if (d > bestD) { bestD = d; best = [colours[i], colours[j]]; }
      }
    }
    return best;
  }

  function nearest(palette, c) {
    let bi = 0, bd = Infinity;
    palette.forEach((p, i) => { if (p) { const d = dist2(p, c); if (d < bd) { bd = d; bi = i; } } });
    return bi;
  }

  // BC1 with 1-bit alpha. Any covered pixel is drawn, so thin lines survive in the small mip levels.
  function encodeDXT1(pixels, out, o) {
    const visible = pixels.map((p) => p && p[3] > 0);
    const colours = pixels.filter((p, i) => visible[i]).map((p) => p.slice(0, 3));
    const d = dv(out);
    if (!colours.length) {
      d.setUint16(o, 0, true); d.setUint16(o + 2, 0, true); d.setUint32(o + 4, 0xFFFFFFFF, true);
      return;
    }
    const [ea, eb] = endpoints(colours);
    let c0 = to565(ea), c1 = to565(eb);
    const anyHidden = pixels.some((p, i) => p && !visible[i]);
    let palette;
    if (anyHidden || c0 === c1) {
      if (c0 > c1) [c0, c1] = [c1, c0];
      const a = from565(c0), b = from565(c1);
      palette = [a, b, a.map((v, k) => (v + b[k]) / 2), null];
    } else {
      if (c0 < c1) [c0, c1] = [c1, c0];
      const a = from565(c0), b = from565(c1);
      palette = [a, b, a.map((v, k) => (2 * v + b[k]) / 3), a.map((v, k) => (v + 2 * b[k]) / 3)];
    }
    let bits = 0;
    pixels.forEach((p, i) => {
      const idx = !p ? 0 : visible[i] ? nearest(palette, p) : 3;
      bits = (bits | (idx << (i * 2))) >>> 0;
    });
    d.setUint16(o, c0, true); d.setUint16(o + 2, c1, true); d.setUint32(o + 4, bits, true);
  }

  // BC3: interpolated alpha block + four-colour block.
  function encodeDXT5(pixels, out, o) {
    const live = pixels.filter(Boolean);
    let a0 = 0, a1 = 255;
    for (const p of live) { a0 = Math.max(a0, p[3]); a1 = Math.min(a1, p[3]); }
    if (!live.length) { a0 = 0; a1 = 0; }
    out[o] = a0; out[o + 1] = a1;
    const alphas = [a0, a1];
    for (let k = 1; k <= 6; k++) alphas.push(((7 - k) * a0 + k * a1) / 7);
    // 48 index bits, little endian: pixels 0-7 in the first 3 bytes, 8-15 in the next 3
    let first = 0, second = 0;
    pixels.forEach((p, i) => {
      let idx = 0;
      if (p && a0 !== a1) {
        let bd = Infinity;
        alphas.forEach((a, k) => { const dd = Math.abs(a - p[3]); if (dd < bd) { bd = dd; idx = k; } });
      }
      if (i < 8) first |= idx << (i * 3); else second |= idx << ((i - 8) * 3);
    });
    out[o + 2] = first & 255; out[o + 3] = (first >>> 8) & 255; out[o + 4] = (first >>> 16) & 255;
    out[o + 5] = second & 255; out[o + 6] = (second >>> 8) & 255; out[o + 7] = (second >>> 16) & 255;
    const d = dv(out);
    const colours = pixels.filter((p) => p && p[3] > 0).map((p) => p.slice(0, 3));
    if (!colours.length) {
      d.setUint16(o + 8, 0, true); d.setUint16(o + 10, 0, true); d.setUint32(o + 12, 0, true);
      return;
    }
    const [ea, eb] = endpoints(colours);
    let c0 = to565(ea), c1 = to565(eb);
    if (c0 < c1) [c0, c1] = [c1, c0];
    const a = from565(c0), b = from565(c1);
    const palette = c0 === c1 ? [a, null, null, null]
      : [a, b, a.map((v, k) => (2 * v + b[k]) / 3), a.map((v, k) => (v + 2 * b[k]) / 3)];
    let bits = 0;
    pixels.forEach((p, i) => {
      const idx = p && p[3] > 0 ? nearest(palette, p) : 0;
      bits = (bits | (idx << (i * 2))) >>> 0;
    });
    d.setUint16(o + 8, c0, true); d.setUint16(o + 10, c1, true); d.setUint32(o + 12, bits, true);
  }

  // Encodes a full mip chain laid out the way the resource stores it (each level stride*height/4^n bytes).
  function encodeTexture(tex, format, opts) {
    const out = new Uint8Array(tex.dataLength);
    let img = { px: drawTracerSheet(tex.width, tex.height, opts), w: tex.width, h: tex.height };
    let pos = 0, len = tex.stride * tex.height;
    for (let level = 0; level < tex.levels; level++) {
      if (format === FMT.A8R8G8B8) {
        const n = Math.min(len, img.w * img.h * 4, out.length - pos);
        for (let i = 0; i + 3 < n; i += 4) {
          out[pos + i] = img.px[i + 2]; out[pos + i + 1] = img.px[i + 1]; out[pos + i + 2] = img.px[i]; out[pos + i + 3] = img.px[i + 3];
        }
      } else {
        const bsize = format === FMT.DXT1 ? 8 : 16;
        const bw = Math.max(1, Math.ceil(img.w / 4)), bh = Math.max(1, Math.ceil(img.h / 4));
        const tmp = new Uint8Array(bw * bh * bsize);
        for (let by = 0; by < bh; by++) {
          for (let bx = 0; bx < bw; bx++) {
            const pixels = blockPixels(img, bx, by);
            const o = (by * bw + bx) * bsize;
            if (format === FMT.DXT1) encodeDXT1(pixels, tmp, o); else encodeDXT5(pixels, tmp, o);
          }
        }
        out.set(tmp.subarray(0, Math.max(0, Math.min(tmp.length, out.length - pos))), pos);
      }
      pos += len;
      len = Math.floor(len / 4);
      if (pos >= out.length) break;
      img = halve(img.px, img.w, img.h);
    }
    return out;
  }

  // Formats we can write in place. BC7 and DXT3 sheets are rewritten as DXT5, which has the same size.
  function textureTarget(tex) {
    if (tex.format === FMT.DXT1) return FMT.DXT1;
    if (tex.format === FMT.DXT5 || tex.format === FMT.BC7 || tex.format === FMT.DXT3) return FMT.DXT5;
    if (tex.format === FMT.A8R8G8B8) return FMT.A8R8G8B8;
    return 0;
  }

  // ---------------------------------------------------------------- keeping or recolouring the pack's own sheet

  // Beam and smoke modes that start from the pack's own pixels instead of drawing new ones.
  const FROM_PACK = new Set(['keep', 'recolour']);
  const canRecolour = (tex) => !!tex && (tex.format === FMT.DXT1 || tex.format === FMT.DXT5);

  // Keeps each pixel's brightness: the brightest pixel of the region (ref) becomes exactly `rgb`.
  function tintRgb(c, rgb, ref) {
    const k = ref > 0 ? Math.min(1, (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / ref) : 1;
    return [Math.round(rgb[0] * k), Math.round(rgb[1] * k), Math.round(rgb[2] * k)];
  }

  // Which part of the sheet a block (or pixel column range) covers at a given level width.
  function regionOf(x0, x1, w) {
    const f0 = Math.floor((x0 * 4) / w), f1 = Math.floor((Math.min(x1, w - 1) * 4) / w);
    if (f0 >= 3) return 'beam';
    if (f1 <= 2) return 'smoke';
    return 'mixed';
  }

  // Brightest pixel in each part of the top level, used as the recolour reference.
  function sheetRefs(px, w, h) {
    const refs = { smoke: 0, beam: 0 };
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (!px[i + 3]) continue;
        const l = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        const r = regionOf(x, x, w);
        if (l > refs[r]) refs[r] = l;
      }
    }
    return refs;
  }

  // Swaps the two colour endpoints of a block and fixes its indices so every pixel keeps its colour.
  function swapEndpoints(bits, fourColour) {
    let out = 0;
    for (let i = 0; i < 16; i++) {
      let v = (bits >>> (i * 2)) & 3;
      if (v < 2) v ^= 1;
      else if (fourColour) v ^= 1;
      out = (out | (v << (i * 2))) >>> 0;
    }
    return out;
  }

  // Recolours one DXT1 or DXT5 block in place. Only the two colour endpoints change, so the shape and the
  // transparency stay exactly as they were.
  function recolourBlock(buf, o, dxt5, rgb, ref) {
    const d = dv(buf);
    const co = dxt5 ? o + 8 : o;
    const c0 = d.getUint16(co, true), c1 = d.getUint16(co + 2, true);
    let bits = d.getUint32(co + 4, true);
    const fourColour = dxt5 || c0 > c1;
    let n0 = to565(tintRgb(from565(c0), rgb, ref)), n1 = to565(tintRgb(from565(c1), rgb, ref));
    if (fourColour) {
      if (n0 < n1) { [n0, n1] = [n1, n0]; bits = swapEndpoints(bits, true); }
      if (!dxt5 && n0 === n1) { if (n0 > 0) n1 = n0 - 1; else n0 = 1; }
    } else if (n0 > n1) {
      [n0, n1] = [n1, n0]; bits = swapEndpoints(bits, false);
    }
    d.setUint16(co, n0, true); d.setUint16(co + 2, n1, true); d.setUint32(co + 4, bits, true);
  }

  function writeTracerTexture(y, tex, opts) {
    const beam = opts.beam || {}, smoke = opts.smoke || {};
    const beamMode = beam.style || 'solid', smokeMode = smoke.mode || 'off';
    if (beamMode === 'keep' && smokeMode === 'keep') return;
    const fromPack = FROM_PACK.has(beamMode) || FROM_PACK.has(smokeMode);
    if (fromPack && !canRecolour(tex)) {
      throw new Error(`This pack stores its tracer texture as ${tex.formatName}, so the maker can't keep or recolour part of it. Pick a drawn beam and smoke instead.`);
    }
    const target = fromPack ? tex.format : textureTarget(tex);
    if (!target) throw new Error(`The tracer texture uses ${tex.formatName}, which the maker can't redraw`);
    const drawnOpts = {
      beam: FROM_PACK.has(beamMode) ? { style: 'none' } : beam,
      smoke: FROM_PACK.has(smokeMode) ? { mode: 'off' } : smoke,
    };
    const drawn = encodeTexture(tex, target, drawnOpts);
    if (!fromPack) {
      y.u8.set(drawn, tex.data);
      if (target !== tex.format) y.setU32(tex.off + 0x58, target);
      return;
    }
    const original = y.u8.slice(tex.data, tex.data + tex.dataLength);
    const refs = sheetRefs(decodeTexture(y, tex), tex.width, tex.height);
    const dxt5 = tex.format === FMT.DXT5, bsize = dxt5 ? 16 : 8;
    const out = new Uint8Array(tex.dataLength);
    let pos = 0, len = tex.stride * tex.height, w = tex.width, h = tex.height;
    for (let level = 0; level < tex.levels && pos < out.length; level++) {
      const bw = Math.max(1, Math.ceil(w / 4)), bh = Math.max(1, Math.ceil(h / 4));
      for (let by = 0; by < bh; by++) {
        for (let bx = 0; bx < bw; bx++) {
          const o = pos + (by * bw + bx) * bsize;
          if (o + bsize > out.length) continue;
          const region = regionOf(bx * 4, bx * 4 + 3, w);
          const mode = region === 'beam' ? beamMode : region === 'smoke' ? smokeMode : FROM_PACK.has(smokeMode) ? smokeMode : beamMode;
          if (!FROM_PACK.has(mode)) { out.set(drawn.subarray(o, o + bsize), o); continue; }
          out.set(original.subarray(o, o + bsize), o);
          if (mode === 'recolour') {
            const smokePart = region === 'smoke' || (region === 'mixed' && FROM_PACK.has(smokeMode));
            recolourBlock(out, o, dxt5, hexRgb(smokePart ? smoke.colour : beam.colour), smokePart ? refs.smoke : refs.beam);
          }
        }
      }
      pos += len;
      len = Math.floor(len / 4);
      w = Math.max(1, w >> 1); h = Math.max(1, h >> 1);
    }
    y.u8.set(out, tex.data);
  }

  // What the sheet will look like, for previews: the pack's own pixels (kept or recoloured) where a mode starts
  // from the pack, freshly drawn pixels elsewhere. `original` may be null when no pack is loaded.
  function composeSheet(original, w, h, opts) {
    const beam = opts.beam || {}, smoke = opts.smoke || {};
    const drawn = drawTracerSheet(w, h, {
      beam: FROM_PACK.has(beam.style) ? { style: 'none' } : beam,
      smoke: FROM_PACK.has(smoke.mode) ? { mode: 'off' } : smoke,
    });
    if (!original) return drawn;
    const refs = sheetRefs(original, w, h);
    const beamRgb = hexRgb(beam.colour), smokeRgb = hexRgb(smoke.colour);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const region = regionOf(x, x, w);
        const mode = region === 'beam' ? beam.style : smoke.mode;
        if (!FROM_PACK.has(mode)) continue;
        const i = (y * w + x) * 4;
        const c = [original[i], original[i + 1], original[i + 2]];
        const out = mode === 'recolour' ? tintRgb(c, region === 'beam' ? beamRgb : smokeRgb, refs[region]) : c;
        drawn[i] = out[0]; drawn[i + 1] = out[1]; drawn[i + 2] = out[2]; drawn[i + 3] = original[i + 3];
      }
    }
    return drawn;
  }

  // Decodes a DXT1/DXT5/A8R8G8B8 texture's top level to RGBA for previews. Returns null for other formats.
  function decodeTexture(y, tex) {
    const { width: w, height: h } = tex;
    const src = y.u8.subarray(tex.data, tex.data + tex.dataLength);
    const px = new Uint8Array(w * h * 4);
    const fmt = tex.format;
    if (fmt === FMT.A8R8G8B8) {
      for (let i = 0; i < w * h; i++) {
        px[i * 4] = src[i * 4 + 2]; px[i * 4 + 1] = src[i * 4 + 1]; px[i * 4 + 2] = src[i * 4]; px[i * 4 + 3] = src[i * 4 + 3];
      }
      return px;
    }
    if (fmt !== FMT.DXT1 && fmt !== FMT.DXT5) return null;
    const bsize = fmt === FMT.DXT1 ? 8 : 16;
    const bw = Math.ceil(w / 4);
    const d = dv(src);
    for (let by = 0; by < Math.ceil(h / 4); by++) {
      for (let bx = 0; bx < bw; bx++) {
        const o = (by * bw + bx) * bsize;
        const co = fmt === FMT.DXT1 ? o : o + 8;
        const c0 = d.getUint16(co, true), c1 = d.getUint16(co + 2, true), bits = d.getUint32(co + 4, true);
        const a = from565(c0), b = from565(c1);
        const four = fmt === FMT.DXT5 || c0 > c1;
        const pal = four
          ? [a, b, a.map((v, k) => (2 * v + b[k]) / 3), a.map((v, k) => (v + 2 * b[k]) / 3)]
          : [a, b, a.map((v, k) => (v + b[k]) / 2), [0, 0, 0]];
        let alphas = null, abits = 0n;
        if (fmt === FMT.DXT5) {
          const a0 = src[o], a1 = src[o + 1];
          alphas = [a0, a1];
          if (a0 > a1) for (let k = 1; k <= 6; k++) alphas.push(((7 - k) * a0 + k * a1) / 7);
          else { for (let k = 1; k <= 4; k++) alphas.push(((5 - k) * a0 + k * a1) / 5); alphas.push(0, 255); }
          for (let k = 5; k >= 0; k--) abits = (abits << 8n) | BigInt(src[o + 2 + k]);
        }
        for (let i = 0; i < 16; i++) {
          const x = bx * 4 + (i & 3), yy = by * 4 + (i >> 2);
          if (x >= w || yy >= h) continue;
          const idx = (bits >>> (i * 2)) & 3;
          const p = (yy * w + x) * 4;
          const c = pal[idx];
          px[p] = c[0]; px[p + 1] = c[1]; px[p + 2] = c[2];
          if (fmt === FMT.DXT5) px[p + 3] = Math.round(alphas[Number((abits >> BigInt(i * 3)) & 7n)]);
          else px[p + 3] = !four && idx === 3 ? 0 : 255;
        }
      }
    }
    return px;
  }

  // ---------------------------------------------------------------- packages

  // Finds core.ypt inside a pack (any depth). Accepts a standalone .ypt too.
  function openPack(bytes, fileName) {
    const d = dv(bytes);
    if (bytes.length >= 4 && d.getUint32(0, true) === RSC7) {
      return { kind: 'ypt', fileName, res: openResource(bytes) };
    }
    const archive = readRpf(bytes, fileName);
    const files = listFiles(archive);
    const hits = files.filter((f) => f.node.kind === 'rsc' && /(^|\/)core\.ypt$/i.test(f.path));
    if (!hits.length) {
      const ypts = files.filter((f) => /\.ypt$/i.test(f.path)).map((f) => f.path);
      throw new Error(ypts.length ? `No core.ypt in this pack (found ${ypts.join(', ')}). Tracers live in core.ypt.` : 'No core.ypt in this pack. Tracers live in core.ypt.');
    }
    const first = hits[0].node;
    if (hits.some((h) => !sameBytes(h.node.stored, first.stored))) {
      throw new Error(`This pack has ${hits.length} different core.ypt files (${hits.map((h) => h.path).join(', ')}), so the maker can't tell which one the game uses.`);
    }
    return { kind: 'rpf', fileName, archive, paths: hits.map((h) => h.path), nodes: hits.map((h) => h.node),
             res: openResource(first.stored, first.sysf, first.gfxf), files };
  }

  function sameBytes(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function savePack(pack, level, body) {
    const stored = packResource(pack.res, level, body);
    if (pack.kind === 'ypt') return stored;
    for (const n of pack.nodes) n.stored = stored;
    return writeRpf(pack.archive);
  }

  // ---------------------------------------------------------------- bloodfx.dat

  const BLOOD_COLUMNS = ['PUNCH_KICK', 'MELEE_WOOD', 'MELEE_METAL', 'MELEE_SHARP', 'MELEE_GENERIC', 'PISTOL_SMALL', 'PISTOL_LARGE',
    'PISTOL_SILENCED', 'RUBBER', 'SMG', 'SHOTGUN', 'RIFLE_ASSAULT', 'RIFLE_SNIPER', 'ROCKET', 'GRENADE', 'MOLOTOV',
    'FIRE', 'EXPLOSION', 'LASER', 'STUNGUN', 'HEAVY_MG', 'VEHICLE_MG', 'CLOWN', 'ALIEN'];
  const WEAPONS = {
    guns: ['PISTOL_SMALL', 'PISTOL_LARGE', 'PISTOL_SILENCED', 'SMG', 'RIFLE_ASSAULT', 'HEAVY_MG', 'VEHICLE_MG'],
    shotguns: ['SHOTGUN'],
    snipers: ['RIFLE_SNIPER'],
    melee: ['PUNCH_KICK', 'MELEE_WOOD', 'MELEE_METAL', 'MELEE_SHARP', 'MELEE_GENERIC'],
    explosions: ['ROCKET', 'GRENADE', 'EXPLOSION'],
  };
  const ZONE_OF = (name) => (name === 'HEAD' || name === 'NECK' ? 'head' : name === 'ANIMAL_DEFAULT' ? 'animals' : 'body');
  // Info rows: id, 33 numbers, 4 effect names (normal, body armour, heavy armour, underwater),
  // size evo, damage chance, 3 ped damage names.
  const T_TINT = 8, T_SIZES = 20, T_FX = 34, T_EVO = 38, INFO_TOKENS = 43;

  function fmtNum(v) {
    const s = String(Number(v.toFixed(3)));
    return s.includes('.') ? s : s + '.0';
  }

  class BloodDat {
    constructor(text) {
      if (!/BLOODFX_TABLE_\w+_START/.test(text)) throw new Error('This is not a bloodfx.dat file');
      this.items = [];
      this.tables = {};
      this.entry = new Map();
      this.exit = new Map();
      this.problems = [];
      let section = null;
      for (const raw of text.split('\n')) {
        const item = { raw };
        this.items.push(item);
        const eol = raw.endsWith('\r') ? '\r' : '';
        const body = eol ? raw.slice(0, -1) : raw;
        const hash = body.indexOf('#');
        const code = hash >= 0 ? body.slice(0, hash) : body;
        const trimmed = code.trim();
        if (!trimmed) continue;
        const m = /^BLOODFX_(TABLE_\w+|ENTRY_INFO|EXIT_INFO)_(START|END)$/.exec(trimmed);
        if (m) { section = m[2] === 'START' ? m[1] : null; continue; }
        if (!section) continue;
        const parts = code.split(/(\s+)/);
        const tok = [];
        parts.forEach((p, i) => { if (i % 2 === 0 && p !== '') tok.push(i); });
        const row = { parts, tok, comment: hash >= 0 ? body.slice(hash) : '', eol, section };
        if (section.startsWith('TABLE')) {
          row.name = parts[tok[0]];
          if (tok.length !== BLOOD_COLUMNS.length + 1) { this.problems.push(`${section} ${row.name}: ${tok.length - 1} columns`); continue; }
          (this.tables[section] = this.tables[section] || []).push(row);
        } else {
          row.id = parseInt(parts[tok[0]], 10);
          const numeric = tok.slice(1, T_FX).every((i) => /^-?\d+(\.\d+)?$/.test(parts[i]));
          if (tok.length < INFO_TOKENS || !numeric || Number.isNaN(row.id)) { this.problems.push(`${section} row ${parts[tok[0]]} has an unexpected layout`); continue; }
          (section === 'ENTRY_INFO' ? this.entry : this.exit).set(row.id, row);
        }
        item.row = row;
      }
      if (!Object.keys(this.tables).length || !this.entry.size) throw new Error('No blood tables or entry rows found in this bloodfx.dat');
    }

    get(row, k) { return row.parts[row.tok[k]]; }
    set(row, k, v) { row.parts[row.tok[k]] = String(v); row.dirty = true; }

    toString() {
      return this.items.map((it) => (it.row ? it.row.parts.join('') + it.row.comment + it.row.eol : it.raw)).join('\n');
    }

    // Table cells for the given zones and weapon groups, skipping empty (0) cells.
    cells(zones, weapons, opts) {
      opts = opts || {};
      const cols = new Set(weapons.flatMap((w) => WEAPONS[w] || []));
      const out = [];
      for (const [section, rows] of Object.entries(this.tables)) {
        if (opts.dead === false && /DEAD/.test(section)) continue;
        for (const row of rows) {
          if (!zones.includes(ZONE_OF(row.name))) continue;
          BLOOD_COLUMNS.forEach((col, c) => {
            if (!cols.has(col)) return;
            const id = parseInt(this.get(row, c + 1), 10);
            if (id) out.push({ row, k: c + 1, id });
          });
        }
      }
      return out;
    }

    usage(id) {
      const out = [];
      for (const rows of Object.values(this.tables)) {
        for (const row of rows) for (let k = 1; k <= BLOOD_COLUMNS.length; k++) if (parseInt(this.get(row, k), 10) === id) out.push({ row, k });
      }
      return out;
    }

    freeId(near) {
      const used = new Set([...this.entry.keys(), ...this.exit.keys()]);
      for (const rows of Object.values(this.tables)) for (const row of rows) for (let k = 1; k <= BLOOD_COLUMNS.length; k++) used.add(parseInt(this.get(row, k), 10));
      const start = Math.floor(near / 100) * 100;
      for (let id = start + 10; id < start + 100; id++) if (!used.has(id)) return id;
      for (let id = 100; id < 1000; id++) if (!used.has(id)) return id;
      throw new Error('No free ids left in bloodfx.dat');
    }

    // Copies an id's entry and exit rows to a new id (placed right after the originals).
    clone(id) {
      const fresh = this.freeId(id);
      const label = String(fresh).padStart(3, '0');
      for (const map of [this.entry, this.exit]) {
        const src = map.get(id);
        if (!src) continue;
        const row = { ...src, parts: src.parts.slice(), dirty: true, id: fresh };
        row.parts[row.tok[0]] = label;
        const at = this.items.findIndex((it) => it.row === src);
        this.items.splice(at + 1, 0, { row });
        map.set(fresh, row);
      }
      return fresh;
    }

    // Points the chosen zone/weapon cells at info rows playing `fx`. Ids shared with cells outside the
    // selection are cloned first, so nothing else changes.
    route(zones, weapons, fx, opts) {
      opts = opts || {};
      const cells = this.cells(zones, weapons, opts);
      const byId = new Map();
      for (const c of cells) {
        if (!this.entry.has(c.id)) continue;
        if (!byId.has(c.id)) byId.set(c.id, []);
        byId.get(c.id).push(c);
      }
      const clones = [];
      const edited = [];
      for (const [id, picked] of byId) {
        let target = id;
        if (this.usage(id).some((c) => !picked.some((p) => p.row === c.row && p.k === c.k))) {
          target = this.clone(id);
          clones.push([id, target]);
          const label = String(target).padStart(3, '0');
          for (const c of picked) this.set(c.row, c.k, label);
        }
        const row = this.entry.get(target);
        if (fx) {
          this.set(row, T_FX, fx);
          if (opts.armour) { this.set(row, T_FX + 1, fx); this.set(row, T_FX + 2, fx); }
          if (opts.underwater) this.set(row, T_FX + 3, fx);
        }
        if (opts.size !== undefined && opts.size !== null) this.set(row, T_EVO, fmtNum(clamp(opts.size, 0, 1)));
        edited.push(target);
      }
      return { cells: cells.length, edited, clones };
    }

    // Blood decal colour on every info row (game default is 50 0 0).
    tint(rgb) {
      for (const row of [...this.entry.values(), ...this.exit.values()]) {
        for (let i = 0; i < 3; i++) this.set(row, T_TINT + i, Math.round(clamp(rgb[i], 0, 255)));
      }
    }

    // Scales the splat/spray decal sizes on every info row.
    splatter(factor) {
      for (const row of [...this.entry.values(), ...this.exit.values()]) {
        for (let k = T_SIZES; k < T_SIZES + 8; k++) {
          const v = parseFloat(this.get(row, k));
          if (v > 0) this.set(row, k, fmtNum(v * factor));
        }
      }
    }

    // What plays where: zone -> weapon group -> effect names (normal column), from the alive tables.
    summary() {
      const out = {};
      for (const zone of ['head', 'body', 'animals']) {
        out[zone] = {};
        for (const w of Object.keys(WEAPONS)) {
          const names = new Set();
          for (const c of this.cells([zone], [w], { dead: false })) {
            const row = this.entry.get(c.id);
            names.add(row ? this.get(row, T_FX) : `missing ${c.id}`);
          }
          out[zone][w] = [...names];
        }
      }
      return out;
    }

    // Every id a table points at must have an entry row; ids are unique.
    check() {
      const issues = [...this.problems];
      for (const [section, rows] of Object.entries(this.tables)) {
        for (const row of rows) {
          for (let k = 1; k <= BLOOD_COLUMNS.length; k++) {
            const id = parseInt(this.get(row, k), 10);
            if (id && !this.entry.has(id)) issues.push(`${section} ${row.name} ${BLOOD_COLUMNS[k - 1]} points at ${id}, which has no entry row`);
          }
        }
      }
      return issues;
    }

    effects() {
      const names = new Set();
      for (const row of [...this.entry.values(), ...this.exit.values()]) {
        for (let k = T_FX; k < T_FX + 4; k++) { const n = this.get(row, k); if (n !== '-') names.add(n); }
      }
      return [...names].sort();
    }
  }

  return {
    setZlib, joaat, readRpf, writeRpf, listFiles, readBinary, pageSize, openResource, packResource,
    Ypt, readTracer, applyTracer, drawTracerSheet, composeSheet, canRecolour, encodeTexture, decodeTexture, textureTarget, openPack, savePack,
    colourRules, recolourRules, packContents, readTexture,
    FMT, FMT_NAME, argb, BloodDat, WEAPONS, BLOOD_COLUMNS, INFO: { T_TINT, T_SIZES, T_FX, T_EVO },
  };
});

    const m = /^([a-z0-9-]+)?((?:[.#][\w-]+)*)$/i.exec(spec);

    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === undefined || v === null) continue;
        if (v === false) { if (k in el && typeof el[k] === 'boolean') el[k] = false; continue; }
        if (k === 'role' || k.startsWith('aria')) el.setAttribute(k === 'role' ? k : k.replace(/^aria([A-Z])/, (_, c) => 'aria-' + c.toLowerCase()), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'style') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv; } }
        else if (k === 'attrs') { for (const [ak, av] of Object.entries(v)) if (av !== undefined && av !== null && av !== false) el.setAttribute(ak, av === true ? '' : av); }
        else if (k === 'html') el.innerHTML = v; // static markup only (icons)
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'class') el.className = v;
        else if (k in el) el[k] = v;

/* BloodFX Maker preview stage: a canvas sketch of the tracer and the hit effect. Not a render of GTA's lighting. */
(function (root) {
  'use strict';

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;

  function create(canvas, opts) {
    const ctx = canvas.getContext('2d');

    sheet.width = 128; sheet.height = 256;

    function setSheet(px, w, h) {
      if (sheet.width !== w || sheet.height !== h) { sheet.width = w; sheet.height = h; }

      sky.addColorStop(0, '#04060b'); sky.addColorStop(0.55, '#111a2c'); sky.addColorStop(0.78, '#2b2236'); sky.addColorStop(1, '#0a0d14');
