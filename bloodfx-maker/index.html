    // A screenshot from the player's own game, cropped to fill the stage.
    function paintImage(b, img) {
      const k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      const w = img.naturalWidth * k, h = img.naturalHeight * k;
      b.fillStyle = '#000'; b.fillRect(0, 0, W, H);
      b.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      b.fillStyle = 'rgba(0,0,0,0.12)'; b.fillRect(0, 0, W, H);
    }

    function resize() {
      const r = canvas.getBoundingClientRect();
      dpr = Math.min(2, root.devicePixelRatio || 1);
      W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr));
      canvas.width = W; canvas.height = H;
      backdrop = document.createElement('canvas');
      backdrop.width = W; backdrop.height = H;
      const b = backdrop.getContext('2d');
      if (view.scene === 'image' && view.image) paintImage(b, view.image);
      else if (view.scene === 'range') paintRange(b);
      else paintStreet(b);
      if (!running) still();
    }

    // ------------------------------------------------------------ geometry per camera
    function rig() {
      if (view.camera === 'shooter') {
        const s = H / 400;
        return { muzzle: [W * 0.66, H * 0.97], dummy: { x: W * 0.52, headY: H * 0.43, r: 9 * s, top: H * 0.455, bottom: H * 0.6, w: 20 * s }, perspective: true, scale: 0.45 };
      }
      return { muzzle: [W * 0.07, H * 0.66], dummy: { x: W * 0.8, headY: H * 0.33, r: H * 0.045, top: H * 0.39, bottom: H * 0.74, w: H * 0.1 }, perspective: false, scale: 1 };
    }

    function drawDummy(c, g) {
      const d = g.dummy;
      if (view.scene === 'image' && view.image) {
        c.save(); c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 1.5 * dpr;
        const x = d.x, y = d.headY, r = 6 * dpr;
        c.beginPath(); c.moveTo(x - r * 2, y); c.lineTo(x - r * 0.6, y); c.moveTo(x + r * 0.6, y); c.lineTo(x + r * 2, y);
        c.moveTo(x, y - r * 2); c.lineTo(x, y - r * 0.6); c.moveTo(x, y + r * 0.6); c.lineTo(x, y + r * 2); c.stroke(); c.restore();
        return;
      }
      c.save();
      c.fillStyle = '#273042'; c.strokeStyle = 'rgba(160,185,220,0.38)'; c.lineWidth = 1.5 * dpr;
      c.beginPath(); c.arc(d.x, d.headY, d.r, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath();
      if (c.roundRect) c.roundRect(d.x - d.w / 2, d.top, d.w, d.bottom - d.top, d.w * 0.35); else c.rect(d.x - d.w / 2, d.top, d.w, d.bottom - d.top);
      c.fill(); c.stroke();
      c.fillStyle = '#1b2230';
      c.fillRect(d.x - d.w * 0.04, d.bottom, d.w * 0.08, (d.bottom - d.top) * 0.18);
      c.restore();
      if (!g.perspective) {
        const [mx, my] = g.muzzle;
        c.save(); c.fillStyle = '#1d2433'; c.strokeStyle = 'rgba(160,185,220,0.3)'; c.lineWidth = dpr;
        c.beginPath(); c.moveTo(mx - W * 0.06, my + H * 0.015); c.lineTo(mx, my - H * 0.005); c.lineTo(mx, my + H * 0.02); c.lineTo(mx - W * 0.05, my + H * 0.06); c.closePath(); c.fill(); c.stroke();
        c.restore();
      } else {
        // first-person gun silhouette at the bottom right
        const [mx, my] = g.muzzle;
        c.save(); c.fillStyle = '#121722'; c.strokeStyle = 'rgba(160,185,220,0.25)'; c.lineWidth = dpr;
        c.beginPath(); c.moveTo(mx - W * 0.02, my - H * 0.02); c.lineTo(mx + W * 0.02, my - H * 0.03); c.lineTo(mx + W * 0.2, H); c.lineTo(mx + W * 0.04, H); c.closePath(); c.fill(); c.stroke();
        c.restore();
      }
    }

    // ------------------------------------------------------------ tracer
    const speedNow = () => Math.max(0.1, opts.getTracer().speed);

    function fire(zone) {
      shotCount++;
      const g = rig();
      const z = zone || view.focus || (shotCount % 2 ? 'head' : 'body');
      const d = g.dummy;
      const to = z === 'head' ? [d.x - d.r * 0.3, d.headY] : [d.x - d.w * 0.2, d.top + (d.bottom - d.top) * 0.35];
      const t = opts.getTracer();
      const timing = opts.getTiming ? opts.getTiming() : null;
      const lerp = (range) => range[0] + (range[1] - range[0]) * Math.random();
      shots.push({ born: clock, from: g.muzzle.slice(), to, zone: z, perspective: g.perspective, scale: g.scale,
        travel: Math.max(0.05, 0.14 / speedNow()), linger: Math.min(3, t.stay / speedNow()), hit: false,
        smoke: t.smoke !== 'off', smokeLife: Math.min(4, (timing ? lerp(timing.smokeLife) : 0.6) / speedNow()),
        smokeAlpha: timing ? timing.smokeAlpha : null });
      if (shots.length > 8) shots.shift();
    }

    // Piecewise-linear alpha over life from the pack's keyframes ([time, alpha] pairs); a soft fade when there are none.
    function envelope(keys, f) {
      if (!keys || !keys.length) return f < 0.1 ? f / 0.1 : 1 - (f - 0.1) / 0.9;
      if (f <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        if (f <= keys[i][0]) {
          const [t0, a0] = keys[i - 1], [t1, a1] = keys[i];
          return a0 + (a1 - a0) * ((f - t0) / Math.max(1e-6, t1 - t0));
        }
      }
      return keys[keys.length - 1][1];
    }

    function strip(c, index, x0, y0, x1, y1, w0, w1, alpha, v0, v1) {
      const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
      if (len < 1 || alpha <= 0) return;
      const fw = sheet.width / 4, sh = sheet.height;
      c.save();
      c.globalAlpha = Math.min(1, alpha);
      c.translate(x0, y0);
      c.rotate(Math.atan2(dy, dx) - Math.PI / 2);
      if (w0 === w1) {
        c.drawImage(sheet, index * fw, sh * v0, fw, sh * (v1 - v0), -w0 / 2, 0, w0, len);
      } else {
        const n = 14;
        for (let i = 0; i < n; i++) {
          const a = i / n, b = (i + 1) / n;
          const w = w0 + (w1 - w0) * (a + b) / 2;
          c.drawImage(sheet, index * fw, sh * (v0 + (v1 - v0) * a), fw, Math.max(1, sh * (v1 - v0) / n), -w / 2, len * a, w, len / n + 0.5);
        }
      }
      c.restore();
    }

    function drawShots(c) {
      const t = opts.getTracer();
      const base = 30 * dpr * t.zoom;
      c.save();
      c.globalCompositeOperation = 'lighter';
      for (const s of shots) {
        const age = clock - s.born;
        const k = Math.min(1, age / s.travel);
        const [x0, y0] = s.from, [x1, y1] = s.to;
        const hx = x0 + (x1 - x0) * k, hy = y0 + (y1 - y0) * k;
        if (k >= 1 && !s.hit) { s.hit = true; spawn(x1, y1, s.zone, s.scale); }
        const streak = Math.min(1, 0.22 + t.life * 4.5);
        const tk = Math.max(0, k - streak);
        const tx = x0 + (x1 - x0) * tk, ty = y0 + (y1 - y0) * tk;
        const fade = k < 1 ? 1 : Math.max(0, 1 - (age - s.travel) / Math.max(0.06, s.linger));
        // width shrinks with distance in the shooter view
        const wAt = (p) => (s.perspective ? base * (1.6 - 1.45 * p) : base);
        if (s.smoke && age < s.smokeLife) {
          // the game steps through smoke frames 0-2 over the smoke's life and blends between them
          const f = age / s.smokeLife;
          const pos = Math.min(1.999, f * 2);
          const fr = Math.floor(pos), mix = pos - fr;
          const env = envelope(s.smokeAlpha, f);
          strip(c, fr, x0, y0, hx, hy, wAt(0) * 1.1, wAt(k) * 1.1, env * (1 - mix) * 0.95, 0, 1);
          strip(c, fr + 1, x0, y0, hx, hy, wAt(0) * 1.1, wAt(k) * 1.1, env * mix * 0.95, 0, 1);
        }
        if (fade > 0) {
          c.shadowColor = t.style === 'keep' ? (t.tintOn ? t.tint : '#ffb070') : t.colour;
          c.shadowBlur = (4 + t.glow * 0.9) * dpr * (s.perspective ? 0.7 : 1);
          strip(c, 3, tx, ty, hx, hy, wAt(tk), wAt(k), fade * (0.55 + Math.min(t.glow, 40) / 60), 0, 1);
          c.shadowBlur = 0;
          strip(c, 3, tx, ty, hx, hy, wAt(tk), wAt(k), fade, 0, 1);
        }
        if (age < 0.06) {
          const r = (s.perspective ? 40 : 22) * dpr;
          const gr = c.createRadialGradient(x0, y0, 0, x0, y0, r);
          gr.addColorStop(0, 'rgba(255,220,160,0.9)'); gr.addColorStop(1, 'rgba(255,160,60,0)');
          c.fillStyle = gr; c.beginPath(); c.arc(x0, y0, r, 0, Math.PI * 2); c.fill();
        }
      }
      c.restore();
    }

    // ------------------------------------------------------------ hit particles
    function spawn(x, y, zone, scale) {
      const fx = opts.getHit(zone);
      const kind = opts.kindOf(fx);
      const u = (H / 400) * (scale || 1);
      const r = Math.random;
      const add = (o) => parts.push({ x, y, vx: 0, vy: 0, g: 600 * u, life: 1.2, age: 0, size: 3 * u, shape: 'dot', colour: '#fff', spin: 0, rot: r() * 6, add: false, drag: 0.6, floor: y + 120 * u, ...o });
      const burst = (n, speed, make) => {
        for (let i = 0; i < n; i++) {
          const a = -Math.PI * (0.05 + r() * 1.1) + Math.PI * 0.6 * (r() - 0.5);
          const s = speed * (0.3 + r() * 0.9) * u;
          add({ vx: Math.cos(a) * s - 40 * u * r(), vy: Math.sin(a) * s, ...make(i) });
        }
      };
      const pick = (list) => list[Math.floor(r() * list.length)];
      parts.push({ x, y, ring: true, age: 0, life: 0.25, colour: kind === 'none' ? 'rgba(255,255,255,0.45)' : '#ffffff', size: 18 * u });
      switch (kind) {
        case 'confetti': burst(46, 260, () => ({ shape: 'rect', size: 4 * u, colour: pick(PALETTES.confetti), spin: (r() - 0.5) * 18, g: 380 * u, life: 1.8, drag: 1.4 })); break;
        case 'balloon': burst(10, 200, () => ({ shape: 'rect', size: 5 * u, colour: '#e8344a', spin: (r() - 0.5) * 10, life: 1 })); parts.push({ x, y, ring: true, age: 0, life: 0.35, colour: '#ff5a6e', size: 34 * u }); break;
        case 'gumballs': burst(20, 220, () => ({ shape: 'ball', size: 5 * u, colour: pick(PALETTES.confetti), g: 700 * u, life: 2, bounce: true })); break;
        case 'cash': burst(14, 170, () => ({ shape: 'bill', size: 7 * u, colour: r() < 0.5 ? '#4caf50' : '#7fcf73', spin: (r() - 0.5) * 6, g: 120 * u, life: 2.2, drag: 1.8, flutter: true })); break;
        case 'coins': burst(16, 240, () => ({ shape: 'ball', size: 3.5 * u, colour: '#f5c542', g: 800 * u, life: 1.6, bounce: true })); break;
        case 'water': burst(34, 280, () => ({ shape: 'drop', size: 2.6 * u, colour: '#8fd8ff', life: 0.9 })); break;
        case 'oil': burst(26, 230, () => ({ shape: 'drop', size: 3 * u, colour: '#1c1a17', edge: '#6b6458', life: 1.1 })); break;
        case 'paint': burst(30, 250, () => ({ shape: 'drop', size: 3 * u, colour: pick(PALETTES.paint), life: 1 })); break;
        case 'gloop': burst(22, 200, () => ({ shape: 'drop', size: 3.6 * u, colour: '#8bd450', life: 1.1 })); break;
        case 'gore': burst(48, 300, () => ({ shape: 'drop', size: 3.2 * u, colour: r() < 0.6 ? '#8a0d14' : '#5c070c', life: 1.2 })); parts.push({ x, y, mist: true, age: 0, life: 0.6, colour: '150,10,20', size: 40 * u }); break;
        case 'mist': parts.push({ x, y, mist: true, age: 0, life: 0.9, colour: '170,20,30', size: 46 * u }); break;
        case 'blood': burst(24, 230, () => ({ shape: 'drop', size: 2.6 * u, colour: r() < 0.6 ? '#9b0d14' : '#6a0a10', life: 0.9 })); parts.push({ x, y, mist: true, age: 0, life: 0.4, colour: '150,10,20', size: 22 * u }); break;
        case 'feathers': burst(14, 140, () => ({ shape: 'feather', size: 6 * u, colour: '#f2f2f2', g: 60 * u, life: 2.4, drag: 2.2, flutter: true, spin: (r() - 0.5) * 4 })); break;
        case 'paper': burst(12, 160, () => ({ shape: 'bill', size: 7 * u, colour: '#f4f4ef', g: 90 * u, life: 2.2, drag: 2, flutter: true, spin: (r() - 0.5) * 5 })); break;
        case 'glass': burst(22, 260, () => ({ shape: 'shard', size: 4 * u, colour: 'rgba(190,235,255,0.85)', spin: (r() - 0.5) * 16, life: 1 })); break;
        case 'sparks': burst(30, 420, () => ({ shape: 'spark', size: 2 * u, colour: '#fff3b0', g: 500 * u, life: 0.5, add: true })); break;
        case 'foam': burst(14, 120, () => ({ shape: 'puff', size: 7 * u, colour: 'rgba(240,244,250,0.8)', g: 40 * u, life: 1, drag: 2 })); break;
        case 'mud': burst(26, 220, () => ({ shape: 'drop', size: 3.2 * u, colour: '#6b4a2b', life: 1 })); break;
        case 'snow': burst(30, 160, () => ({ shape: 'ball', size: 2.4 * u, colour: '#ffffff', g: 90 * u, life: 2, drag: 1.6 })); break;
        case 'champagne': burst(30, 220, () => ({ shape: 'ball', size: 2.2 * u, colour: r() < 0.5 ? '#f6e7a1' : '#ffffff', g: 260 * u, life: 1.3 })); break;
        case 'star': parts.push({ x, y, star: true, age: 0, life: 0.3, colour: '#fff6c2', size: 30 * u }); break;
        case 'firework': burst(40, 330, () => ({ shape: 'spark', size: 2 * u, colour: pick(PALETTES.firework), g: 160 * u, life: 1.1, add: true })); break;
        case 'none': break;
        default: parts.push({ x, y, mist: true, age: 0, life: 0.6, colour: '200,205,215', size: 30 * u });
      }
      if (parts.length > 700) parts.splice(0, parts.length - 700);
    }

    function drawParts(c, dt) {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += dt;
        if (p.age >= p.life) { parts.splice(i, 1); continue; }
        const a = 1 - p.age / p.life;
        if (p.ring) {
          c.save(); c.globalAlpha = a; c.strokeStyle = p.colour; c.lineWidth = 2 * dpr;
          c.beginPath(); c.arc(p.x, p.y, p.size * (0.4 + (1 - a)), 0, Math.PI * 2); c.stroke(); c.restore();
          continue;
        }
        if (p.mist) {
          const rad = p.size * (0.6 + (1 - a) * 0.9);
          const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
          g.addColorStop(0, `rgba(${p.colour},${0.55 * a})`); g.addColorStop(1, `rgba(${p.colour},0)`);
          c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, rad, 0, Math.PI * 2); c.fill();
          continue;
        }
        if (p.star) {
          c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; c.fillStyle = p.colour; c.translate(p.x, p.y);
          const s = p.size * (0.6 + (1 - a));
          c.beginPath();
          for (let k = 0; k < 8; k++) { const rr = k % 2 ? s * 0.18 : s; const an = (k / 8) * Math.PI * 2; c.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
          c.closePath(); c.fill(); c.restore();
          continue;
        }
        p.vy += p.g * dt;
        p.vx *= Math.exp(-p.drag * dt);
        if (p.flutter) { p.vy *= Math.exp(-2.5 * dt); p.vx += Math.sin(p.age * 7 + p.rot) * 30 * dt * dpr; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.spin * dt;
        if (p.bounce && p.y > p.floor && p.vy > 0) { p.y = p.floor; p.vy *= -0.45; p.vx *= 0.7; }
        c.save();
        c.globalAlpha = Math.min(1, a * 1.4);
        if (p.add) c.globalCompositeOperation = 'lighter';
        c.translate(p.x, p.y);
        c.fillStyle = p.colour;
        switch (p.shape) {
          case 'rect': c.rotate(p.rot); c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); break;
          case 'bill': c.rotate(p.rot); c.fillRect(-p.size, -p.size / 2, p.size * 2, p.size); c.fillStyle = 'rgba(0,0,0,0.18)'; c.fillRect(-p.size * 0.3, -p.size * 0.3, p.size * 0.6, p.size * 0.6); break;
          case 'feather': c.rotate(p.rot); c.beginPath(); c.ellipse(0, 0, p.size, p.size * 0.32, 0, 0, Math.PI * 2); c.fill(); break;
          case 'ball': c.beginPath(); c.arc(0, 0, p.size, 0, Math.PI * 2); c.fill(); c.fillStyle = 'rgba(255,255,255,0.45)'; c.beginPath(); c.arc(-p.size * 0.3, -p.size * 0.3, p.size * 0.35, 0, Math.PI * 2); c.fill(); break;
          case 'shard': c.rotate(p.rot); c.beginPath(); c.moveTo(0, -p.size); c.lineTo(p.size * 0.6, p.size * 0.7); c.lineTo(-p.size * 0.5, p.size * 0.4); c.closePath(); c.fill(); break;
          case 'spark': { const vl = Math.hypot(p.vx, p.vy) || 1; c.strokeStyle = p.colour; c.lineWidth = p.size; c.beginPath(); c.moveTo(0, 0); c.lineTo(-p.vx / vl * p.size * 5, -p.vy / vl * p.size * 5); c.stroke(); break; }
          case 'puff': { const g = c.createRadialGradient(0, 0, 0, 0, 0, p.size * 1.6); g.addColorStop(0, p.colour); g.addColorStop(1, 'rgba(240,244,250,0)'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, p.size * 1.6, 0, Math.PI * 2); c.fill(); break; }
          default: {
            c.rotate(Math.atan2(p.vy, p.vx));
            c.beginPath(); c.ellipse(0, 0, p.size * 1.8, p.size, 0, 0, Math.PI * 2); c.fill();
            if (p.edge) { c.strokeStyle = p.edge; c.lineWidth = dpr; c.stroke(); }
          }
        }
        c.restore();
      }
    }

    // ------------------------------------------------------------ loop
    function draw(dt) {
      if (!backdrop) return;
      const g = rig();
      ctx.drawImage(backdrop, 0, 0);
      drawDummy(ctx, g);
      drawShots(ctx);
      drawParts(ctx, dt);
    }

    function frame(ts) {
      if (!running) return;
      const real = ts / 1000;
      const dtReal = Math.min(0.05, lastReal ? real - lastReal : 0.016);
      lastReal = real;
      const dt = view.paused ? 0 : dtReal * (view.slowmo ? 0.25 : 1);
      clock += dt;
      if (view.auto && !view.paused && clock >= nextShot) {
        fire();
        const t = opts.getTracer();
        nextShot = clock + Math.max(1.5, 0.14 / speedNow() + Math.min(3, t.stay / speedNow()) + 0.9);
      }
      draw(dt);
      root.requestAnimationFrame(frame);
    }

    // A still frame for reduced motion and while hidden: a beam halfway to the head.
    function still() {
      if (!backdrop || running) return;
      const saveShots = shots.splice(0), saveParts = parts.splice(0);
      const g = rig();
      shots.push({ born: clock - 0.1, from: g.muzzle.slice(), to: [g.dummy.x - g.dummy.r * 0.3, g.dummy.headY], zone: 'head', perspective: g.perspective, scale: g.scale,
        travel: 0.2, linger: 1, hit: true, smoke: opts.getTracer().smoke !== 'off', smokeLife: 0.6, smokeAlpha: null });
      draw(0);
      shots.splice(0); shots.push(...saveShots); parts.push(...saveParts);
    }

    function start() {
      if (running || reduce || !visible || document.hidden) return;
      running = true; lastReal = 0;
      root.requestAnimationFrame(frame);
    }
    function stop() { running = false; still(); }

    new root.ResizeObserver(() => resize()).observe(canvas);
    if ('IntersectionObserver' in root) {
      new root.IntersectionObserver((entries) => { visible = entries[0].isIntersecting; if (visible) start(); else stop(); }).observe(canvas);
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });

    return {
      setSheet,
      resize,
      start,
      still,
      fire(zone) {
        if (reduce && !running) { running = true; lastReal = 0; view.auto = false; fire(zone); root.requestAnimationFrame(frame); setTimeout(() => { running = false; still(); }, 2500); return; }
        fire(zone);
      },
      soon() { nextShot = Math.min(nextShot, clock + 0.15); if (!running) still(); },
      set(key, value) {
        view[key] = value;
        if (key === 'scene' || key === 'camera' || key === 'image') { shots.splice(0); parts.splice(0); resize(); }
        if (!running) still();
      },
      get: (key) => view[key],
      reduced: reduce,
    };
  }

  root.BfxPreview = { create };
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* ui/platform.js */
/* Where BloodFX Maker is running: the Windows app (Electron), a Claude artifact, or a plain browser tab. */
(function (root) {
  'use strict';
  const desktop = root.bfxDesktop || null;
  const kind = desktop ? 'desktop' : root.claude ? 'claude' : 'browser';

  // A hidden file input, opened from a click. Resolves null when the dialog is cancelled.
  function pickFile(accept) {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = accept;
      input.style.display = 'none';
      document.body.append(input);
      input.addEventListener('change', () => { resolve(input.files[0] || null); input.remove(); });
      input.addEventListener('cancel', () => { resolve(null); input.remove(); });
      input.click();
    });
  }
  const fromFile = async (file) => (file ? { name: file.name, path: desktop ? desktop.pathForFile(file) : null, bytes: new Uint8Array(await file.arrayBuffer()) } : null);

  let claudeDownloads;
  async function claudeSave(filename, blob) {
    if (claudeDownloads === undefined) {
      try { claudeDownloads = await root.claude.use('downloads'); } catch { claudeDownloads = null; }
    }
    if (!claudeDownloads) throw Object.assign(new Error('Saving is not available in this view.'), { code: 'unavailable' });

    canInstall: !!desktop,
    async openPack() {

<script>/* ui/app.js */
/* BloodFX Maker app: state, undo, loading, saving, and the frame (title bar, toolbar, tabs, status bar) around the pages. */
(function (root) {
  'use strict';
  const U = root.BfxUtil, D = root.BfxData, K = root.BfxControls, P = root.BfxPlatform, A = root.BfxArt;
  const { $, $$, h, clear, tick, plural } = U;
  const VERSION = '2.0';

  const TABS = [
    { id: 'home', label: 'Home', icon: 'home', title: 'Home', text: 'Open a tracer pack, pick a look and hit effects, then save or install.' },
    { id: 'tracer', label: 'Tracer', icon: 'tracer', title: 'Tracer', text: "Keep your pack's tracer, recolour it, or draw a new beam and smoke trail." },
    { id: 'blood', label: 'Blood', icon: 'drop', title: 'Blood', text: 'Pick what plays when a bullet hits someone, for each body part and weapon type.' },
    { id: 'muzzle', label: 'Muzzle flash', icon: 'muzzle', title: 'Muzzle flash', text: "Recolour the flash at the end of the gun. It's saved into the same tracer pack." },
    { id: 'explorer', label: 'Pack explorer', icon: 'explorer', title: 'Pack explorer', text: "Look inside the pack's core.ypt: every effect, texture and file." },
    { id: 'install', label: 'Install', icon: 'install', title: 'Install', text: 'Where the two files go, and a one-click install in the Windows app.' },
    { id: 'settings', label: 'Settings', icon: 'settings', title: 'Settings', text: 'Accent colour, preview and tips.' },

  }

  function start(pageFactories) {

    }

      packValues: { ...D.STOCK },

      blood: { base: 'builtin', fileText: null, fileName: '', fileProblems: [], hits: {}, dead: true, splatOn: false, splat: '#00a0ff', strength: 50, splatter: 1, preset: null },
      muzzle: { enabled: false, match: 'muz', colour: '#3b82ff', glowOn: false, glow: 20, picked: null },
      selection: new Set(['head:guns']),

    let packSeq = 0;

    // ------------------------------------------------------------ undo / redo
    const history = { past: [], future: [], current: null };
    let savedAt = null;
    function snap() {

        tracer: state.tracer, touched: [...state.touched], lookTouched: state.lookTouched, tracerPreset: state.tracerPreset,
        blood: { base: b.base, hits: b.hits, dead: b.dead, splatOn: b.splatOn, splat: b.splat, strength: b.strength, splatter: b.splatter, preset: b.preset },

      renderNote();

      state.tracerPreset = o.tracerPreset;

      renderNote();
    }
    function renderUndo() {

    // ------------------------------------------------------------ tracer
    const look = (t) => ({
      beam: { style: t.style, colour: t.colour, colour2: t.colour2 || null, flip: !!t.flip, core: t.core, width: t.width },
      smoke: { mode: t.smoke, colour: t.smokeColour, colour2: t.smokeColour2 || null, flip: !!t.smokeFlip, width: t.smokeWidth },

    }

    // The tracer sheet a set of settings gives, for previews. Without a pack the pack's own beam and smoke are stand-ins.
    function sheetFor(t) {
      const p = state.pack;
      const orig = p && p.preview ? p.preview : null;
      if (!orig) {
        const L = look(t);
        const beam = t.style === 'keep' ? { style: 'solid', colour: t.tintOn ? t.tint : '#ffb070', width: 3 } : t.style === 'recolour' ? { style: 'solid', colour: t.colour, width: 3 } : L.beam;
        const smoke = t.smoke === 'keep' ? { mode: 'off' } : t.smoke === 'recolour' ? { mode: 'line', colour: t.smokeColour, width: 4 } : L.smoke;

      if (t.style === 'keep' && t.smoke === 'keep') {

    }
    let sheetKey = null, sheetVal = null;
    function sheet() {
      const t = state.tracer;

      if (key !== sheetKey) { sheetKey = key; sheetVal = sheetFor(t); }
      return sheetVal;
    }

    function tracerSettings() {
      const t = state.tracer, s = {};
      if (t.style === 'keep' && t.smoke === 'keep') {
        if (t.tintOn) s.beamRgb = U.rgb01(t.tint);
      } else {
        s.texture = look(t);
        // a new or recoloured beam shows its colour as picked; a recoloured smoke keeps the pack's own particle colour
        if (t.style !== 'keep') { s.beamRgb = [1, 1, 1]; s.tint = '#ffffff'; }

      if (T.has('glow')) s.glow = t.glow;
      if (T.has('zoom')) s.zoom = [t.zoom, t.zoom];
      if (T.has('far')) s.farSize = t.far;
      if (T.has('speed')) { s.effectRate = [t.speed, t.speed]; s.beamRate = [1, 1]; }
      if (T.has('stay')) s.duration = [t.stay, t.stay];
      if (T.has('life')) s.life = [Math.round(t.life * 75) / 100, t.life];
      const m = muzzleChoice();
      if (m) s.muzzle = m;
      return s;
    }

    function describeBeam(t) {
      const grad = (a, b) => (b ? `${a.toUpperCase()} → ${b.toUpperCase()}` : a.toUpperCase());
      switch (t.style) {
        case 'keep': return state.pack ? "pack's beam" + (t.tintOn && t.smoke === 'keep' ? ` tinted ${t.tint.toUpperCase()}` : '') : 'stock beam';
        case 'recolour': return `pack's beam in ${t.colour.toUpperCase()}`;
        case 'none': return 'no beam';
        default: return `${t.style} beam ${t.width}px ${grad(t.colour, t.colour2)}`;
      }
    }
    function describeSmoke(t) {
      switch (t.smoke) {
        case 'keep': return state.pack ? "pack's smoke" : 'stock smoke';
        case 'recolour': return `pack's smoke in ${t.smokeColour.toUpperCase()}`;
        case 'off': return 'no smoke';
        default: return `${t.smoke === 'line' ? 'straight' : 'wavy'} smoke ${t.smokeColour2 ? t.smokeColour.toUpperCase() + ' → ' + t.smokeColour2.toUpperCase() : t.smokeColour.toUpperCase()}`;
      }
    }

    function applyTracerPreset(p) {
      const t = state.tracer;
      Object.assign(t, { colour2: null, flip: false, smokeColour2: null, smokeFlip: false, tintOn: false }, p.set);
      state.lookTouched = true;
      if (p.motion !== false) for (const k of MOTION) if (k in p.set) state.touched.add(k);

      enforceWhole();
      changed('tracer');
      commit();
      preview.soon();
    }

    // ------------------------------------------------------------ blood
    const baseText = () => (state.blood.base === 'file' && state.blood.fileText ? state.blood.fileText : BUILTIN_DAT);
    let baseCache = { text: null, summary: null };
    function baseSummary() {
      const t = baseText();
      if (baseCache.text !== t) baseCache = { text: t, summary: new C.BloodDat(t).summary() };

    }

      const rgb = U.rgbOf(state.blood.splat);

    }
    let bloodKey = null, bloodVal = null;
    function blood() {
      const b = state.blood;
      const key = JSON.stringify([b.base, b.fileName, b.fileText && b.fileText.length, b.hits, b.dead, b.splatOn, b.splat, b.strength, b.splatter]);
      if (bloodVal && key === bloodKey) return bloodVal;
      bloodKey = key;
      try {
        const dat = new C.BloodDat(baseText());
        // Hits with the same settings are routed together, one call per rectangle of the hit map,
        // so shared rows in bloodfx.dat are copied as few times as possible.
        const groups = new Map();
        for (const [cell, a] of Object.entries(b.hits)) {
          if (!a || !validFx(a.fx)) continue;
          const [zone, weapon] = cell.split(':');
          const k = `${a.fx}|${a.armour ? 1 : 0}|${a.size === null || a.size === undefined ? '' : a.size}`;
          if (!groups.has(k)) groups.set(k, { a, zones: new Map() });
          const g = groups.get(k);
          if (!g.zones.has(zone)) g.zones.set(zone, new Set());
          g.zones.get(zone).add(weapon);
        }
        for (const g of groups.values()) {
          const rects = new Map();
          for (const [zone, ws] of g.zones) {
            const wk = [...ws].sort().join(',');
            if (!rects.has(wk)) rects.set(wk, []);
            rects.get(wk).push(zone);
          }
          for (const [wk, zones] of rects) {
            dat.route(zones, wk.split(','), g.a.fx, { armour: g.a.armour, underwater: g.a.armour, size: g.a.size, dead: b.dead });
          }

      } catch (e) {

      }

    }
    function hitCount() { return Object.keys(state.blood.hits).length; }

    function applyBloodPreset(p) {
      const b = state.blood;
      b.hits = {};
      for (const c of p.cells) for (const z of c.zones) for (const w of c.weapons) b.hits[z + ':' + w] = { fx: c.fx, armour: c.armour, size: c.size };
      if (p.id === 'normal') { b.splatOn = false; b.splatter = 1; }
      if (p.splat) { b.splatOn = true; b.splat = p.splat; }
      if (p.splatter) b.splatter = p.splatter;

      commit();

      const now = blood().summary || baseSummary();

        b.hits[cell] = { ...cur, ...patch };

      changed('blood');
      commit();

    function resetHits(cells) {
      for (const cell of cells) delete state.blood.hits[cell];
      state.blood.preset = null;
      changed('blood');
      commit();
    }

    // ------------------------------------------------------------ effects catalogue
    function packContents() {
      const p = state.pack;
      if (!p) return null;
      if (!p.contents) {
        p.contents = C.packContents(p.y);
        p.effectMap = new Map(p.contents.effects.map((e) => [e.name, e]));
      }
      return p.contents;
    }
    function fxInfo(id) {
      const cur = D.EFFECT_BY_ID.get(id);
      const cat = id === '-' ? 'none' : D.categoryOf(id);
      let kind = cur ? cur.kind : D.effectKind(id);
      if (!cur && kind === 'puff') kind = D.CATEGORY_KIND[cat] || 'puff';
      const p = state.pack;
      let loops = false, inPack = null, rule = null;
      if (id !== '-') {
        if (p) {
          packContents();
          rule = p.effectMap.get(id) || null;
          inPack = !!rule;
          loops = rule ? rule.loops !== 0 || rule.duration > 4 : LONG_FX.has(id);
        } else loops = LONG_FX.has(id);
      }
      return { id, label: D.effectLabel(id), curated: !!cur, note: cur && cur.note, group: cur ? cur.group : null, kind, cat, loops, inPack, standard: CORE_FX.has(id), rule };
    }
    // Every effect a hit can play: the curated list first, then the pack's (or GTA's standard) effects.
    let catalogueKey = null, catalogueVal = null;
    function catalogue() {
      const key = state.pack ? state.pack.id : 0;
      if (catalogueKey === key && catalogueVal) return catalogueVal;
      const names = new Set(D.EFFECTS.map((e) => e.id));
      const source = state.pack ? [...state.pack.effects] : [...CORE_FX];
      for (const n of source.sort()) names.add(n);
      catalogueVal = [...names].map(fxInfo);
      catalogueKey = key;
      return catalogueVal;
    }
    // A warning for an effect on a hit, or ''.
    function fxWarning(info) {
      if (info.id === '-') return '';
      if (!validFx(info.id)) return 'Effect names use letters, numbers and underscores only.';
      if (state.pack && !info.inPack) return `Not in ${state.pack.fileName}, so it won't play with that pack.`;
      if (!state.pack && !info.standard) return "Not in GTA's standard core.ypt. It only plays with a pack that adds it.";
      if (info.loops) return 'This effect loops or runs for a long time, so it keeps playing where the bullet hit.';
      return '';
    }

    // ------------------------------------------------------------ muzzle flashes
    let muzzleKey = null, muzzleVal = [];
    function muzzleRules() {
      const p = state.pack;
      if (!p) return [];
      const key = p.id + '|' + state.muzzle.match;
      if (key !== muzzleKey) { muzzleKey = key; muzzleVal = C.colourRules(p.y, state.muzzle.match.trim()); }
      return muzzleVal;
    }
    function muzzlePicked() {
      const rules = muzzleRules();
      const m = state.muzzle;
      return m.picked ? rules.filter((r) => m.picked.has(r.name)) : rules;
    }
    function muzzleChoice() {
      const m = state.muzzle;
      if (!m.enabled || !state.pack) return null;
      const names = muzzlePicked().map((r) => r.name);

    }

    // ------------------------------------------------------------ preview (one viewport, moved between pages)
    const canvas = h('canvas', { attrs: { 'aria-label': 'Preview of the tracer and the hit effect' } });
    const hud = h('div.vp-hud');
    const viewport = h('div.viewport', canvas, hud, h('span.vp-note', 'A sketch of the look, not GTA’s lighting'));
    const target = { zone: null, weapon: 'guns' };
    function previewHit(zone) {
      const b = blood();
      const s = b.summary || b.base;
      const z = target.zone === 'animals' && zone === 'body' ? 'animals' : zone;
      return ((s[z] || s.head)[target.weapon] || [])[0] || '-';
    }
    function timing() {
      const p = state.pack;
      if (!p || !p.tracer.smokeLife) return null;
      const k = p.tracer.smokeLife.keyframes[0];
      const alpha = p.tracer.smokeColour ? p.tracer.smokeColour.rgbaMax.map((x) => [x.t[0], x.v[3]]) : null;
      return { smokeLife: k ? [k.v[0], k.v[1]] : [0.6, 0.6], smokeAlpha: alpha && alpha.length ? alpha : null };
    }
    const preview = root.BfxPreview.create(canvas, {
      getTracer: () => state.tracer,
      getHit: previewHit,
      kindOf: (fx) => fxInfo(fx).kind,
      getTiming: timing,
    });
    preview.set('scene', state.settings.scene === 'image' ? 'street' : state.settings.scene);
    preview.set('camera', state.settings.camera);
    preview.set('auto', state.settings.auto);
    function renderHud() {
      const t = state.tracer;
      clear(hud);
      const chip = (label, value, colour) => h('span.hud-chip', colour ? h('i.sw', { style: { background: colour } }) : null, label + ' ', h('b', value));
      const beamColour = t.style === 'keep' ? (t.tintOn ? t.tint : null) : t.style === 'none' ? null : t.colour;
      const beamText = { keep: state.pack ? 'from the pack' : 'stock', recolour: 'pack, recoloured', none: 'none' }[t.style] || `${t.style} ${t.width}px`;
      hud.append(chip('beam', beamText, beamColour));
      const smokeText = { keep: state.pack ? 'from the pack' : 'stock', recolour: 'pack, recoloured', line: 'straight', wavy: 'wavy' }[t.smoke];
      if (t.smoke !== 'off') hud.append(chip('smoke', smokeText, drawnSmoke(t.smoke) || t.smoke === 'recolour' ? t.smokeColour : null));
      hud.append(chip('speed', '×' + t.speed.toFixed(2)), chip('stays', t.stay.toFixed(2) + ' s'));
      const zone = target.zone || 'head';
      const fx = previewHit(zone === 'animals' ? 'body' : zone);
      hud.append(chip({ head: 'headshot', body: 'body shot', animals: 'animal hit' }[zone], fx === '-' ? 'nothing' : D.effectLabel(fx)));
    }

    // ------------------------------------------------------------ loading
    async function openPackDialog() {
      let f;
      try { f = await P.openPack(); } catch (e) { toast('bad', "Couldn't open the file", e.message || String(e)); return false; }
      if (!f) return false;
      return loadPack(f);
    }
    async function loadPack(f) {

      await tick(40);
      try {
        const pack = C.openPack(f.bytes, f.name);
        const y = new C.Ypt(pack.res);
        const tr = C.readTracer(y);
        const tex = tr.texture;
        let px = null;
        try { px = tex ? C.decodeTexture(y, tex) : null; } catch { px = null; }
        state.pack = {
          id: ++packSeq, fileName: f.name, path: f.path || null, bytes: f.bytes, kind: pack.kind, paths: pack.paths || [],
          files: pack.files ? pack.files.map((x) => ({ path: x.path, kind: x.node.kind, size: x.node.stored ? x.node.stored.length : 0, nested: !!x.node.rpf })) : [],
          y, tracer: tr, effects: new Set(y.effectRules().keys()), preview: px, recolourable: C.canRecolour(tex),
          texture: tex ? { w: tex.width, h: tex.height, format: tex.formatName, levels: tex.levels } : null,
          size: f.bytes.length, contents: null, effectMap: null,
        };
        const v = {
          glow: tr.beamColour && tr.beamColour.emissive[0] ? tr.beamColour.emissive[0].v[0] : D.STOCK.glow,
          zoom: tr.beam.zoom[0],
          far: tr.beam.lodSize ? tr.beam.lodSize.value[0] : D.STOCK.far,
          speed: tr.effect.rate[0] * tr.beam.rate[0],
          stay: Math.max(tr.effect.duration[0], tr.effect.duration[1]),
          life: tr.life && tr.life.keyframes[0] ? tr.life.keyframes[0].v[1] : D.STOCK.life,
        };
        for (const k of MOTION) v[k] = Math.round(v[k] * 1000) / 1000;
        state.packValues = v;
        Object.assign(state.tracer, v);
        state.touched.clear();
        if (!state.lookTouched) { state.tracer.style = 'keep'; state.tracer.smoke = 'keep'; state.tracerPreset = null; }
        enforceWhole();
        muzzleKey = null;
        catalogueKey = null;
        if (f.path) P.addRecent({ path: f.path, name: f.name }).catch(() => {});
        changed('pack');
        // starting from a pack's own values isn't a change of yours
        const clean = history.current === savedAt;
        commit();
        if (clean) { savedAt = history.current; renderNote(); }
        preview.soon();
        const facts = [tex ? `${tex.formatName} ${tex.width}×${tex.height} tracer sheet` : 'no tracer sheet', plural(state.pack.effects.size, 'effect')];
        toast('ok', 'Opened ' + f.name, facts.join(' · ') + (whole() ? `. ${tex ? tex.formatName : 'This'} sheets can be kept whole or redrawn, not recoloured.` : ''));
        return true;
      } catch (e) {
        toast('bad', `Couldn't open ${f.name}`, e.message || String(e));
        return false;
      } finally {
        idle();
      }
    }
    async function openDatDialog() {
      let f;
      try { f = await P.openDat(); } catch (e) { toast('bad', "Couldn't open the file", e.message || String(e)); return false; }
      if (!f) return false;
      return loadDat(f);
    }
    function loadDat(f) {
      try {
        const text = U.latin1(f.bytes);
        const dat = new C.BloodDat(text);
        const b = state.blood;
        b.fileText = text;
        b.fileName = f.name;
        b.fileProblems = dat.problems;
        b.base = 'file';
        changed('blood');
        commit();
        toast('ok', 'Blood now starts from ' + f.name, dat.problems.length ? `${plural(dat.problems.length, 'row')} with an unusual layout will be left as they are.` : 'Your hit changes are applied on top of it.');
        return true;
      } catch (e) {
        toast('bad', `Couldn't use ${f.name}`, (e.message || String(e)) + '. Choose a bloodfx.dat file.');
        return false;
      }
    }
    function pickFile(accept) {
      return new Promise((resolve) => {
        const input = h('input', { type: 'file', accept, style: { display: 'none' } });
        document.body.append(input);
        input.addEventListener('change', () => { resolve(input.files[0] || null); input.remove(); });
        input.addEventListener('cancel', () => { resolve(null); input.remove(); });
        input.click();
      });
    }
    let screenshotUrl = null;
    function useScreenshot(file) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          if (screenshotUrl) URL.revokeObjectURL(screenshotUrl);
          screenshotUrl = url;
          preview.set('image', img);
          preview.set('scene', 'image');
          changed('view');
          toast('ok', 'Preview now uses your screenshot', 'Aim the crosshair where a head would be. Nothing is uploaded.');
          resolve(true);
        };
        img.onerror = () => { URL.revokeObjectURL(url); toast('bad', "Couldn't read that image", 'Use a PNG or JPG screenshot.'); resolve(false); };
        img.src = url;
      });
    }
    async function pickScreenshot() {
      const file = await pickFile('image/png,image/jpeg,image/webp,image/bmp');
      return file ? useScreenshot(file) : false;
    }
    async function openAny(file) {
      const name = file.name.toLowerCase();
      if (/\.(png|jpe?g|webp|bmp|gif)$/.test(name)) return useScreenshot(file);
      const f = await P.fromFile(file);
      if (/\.(dat|txt)$/.test(name)) return loadDat(f);
      return loadPack(f);
    }

    // ------------------------------------------------------------ saving and installing
    async function buildFiles(why) {
      if (!state.pack) {
        toast('info', 'Pick your tracer pack', `The ${why} always holds both files, and the tracer is built from one of your packs.`);
        const ok = await openPackDialog();
        if (!ok) return null;
      }
      const b = blood();
      if (b.error) throw new Error(b.error);
      busy('Rebuilding ' + state.pack.fileName + '…');
      await tick(40);
      const pack = C.openPack(state.pack.bytes, state.pack.fileName);
      const log = C.applyTracer(new C.Ypt(pack.res), tracerSettings());
      const body = await U.deflateRaw(pack.res.data);
      const out = C.savePack(pack, 6, body);
      return { kind: pack.kind, rpfName: pack.kind === 'ypt' ? 'core.ypt' : state.pack.fileName, rpf: out, dat: U.latin1Bytes(b.text), log };
    }

    function installText(files) {
      const t = state.tracer;
      const L = [`BloodFX Maker ${VERSION}`, '', 'Close FiveM before copying files.', ''];
      if (files.kind === 'ypt') {
        L.push('TRACER: core.ypt');
        L.push("  A loose core.ypt. Put it in a resource's stream folder, or replace core.ypt inside your pack with OpenIV.");
      } else {
        L.push('TRACER: mods\\' + files.rpfName);
        L.push('  Copy it to %localappdata%\\FiveM\\FiveM.app\\mods');
        L.push('  Remove the old copy of the same pack. Keep only one tracer pack in that folder.');
      }
      L.push('  Look: ' + describeBeam(t) + '; ' + describeSmoke(t));
      const s = tracerSettings();
      const changes = [];
      if (s.glow !== undefined) changes.push('glow ' + s.glow);
      if (s.zoom) changes.push('thickness x' + s.zoom[0]);
      if (s.farSize !== undefined) changes.push('far size ' + s.farSize);
      if (s.effectRate) changes.push('speed x' + s.effectRate[0]);
      if (s.duration) changes.push('stays ' + s.duration[0] + ' s');
      if (s.life) changes.push('beam life ' + s.life[1] + ' s');
      L.push('  Timing and glow: ' + (changes.length ? changes.join(', ') : "as the pack had them"));
      if (s.muzzle) L.push(`  Muzzle flashes: ${plural(s.muzzle.names.length, 'particle')} recoloured ${state.muzzle.colour.toUpperCase()}`);
      L.push('');
      L.push('BLOOD: citizen\\common\\data\\effects\\bloodfx.dat');
      L.push('  Copy it to %localappdata%\\FiveM\\FiveM.app\\citizen\\common\\data\\effects');
      L.push('  Make the folders if they are missing. Back up any bloodfx.dat already there.');
      L.push('  Starts from: ' + (state.blood.base === 'file' && state.blood.fileText ? state.blood.fileName : 'the built-in file (normal blood everywhere)'));
      const byFx = new Map();
      for (const [cell, a] of Object.entries(state.blood.hits)) {
        const k = `${a.fx}${a.armour ? ' (also with armour and underwater)' : ''}`;
        if (!byFx.has(k)) byFx.set(k, []);
        const [z, w] = cell.split(':');
        byFx.get(k).push(`${z} ${D.WEAPONS.find((x) => x.id === w).label.toLowerCase()}`);
      }
      for (const [k, cells] of byFx) L.push(`  ${cells.join(', ')}: ${k}`);
      if (!byFx.size) L.push('  No hit changes.');
      if (state.blood.splatOn) L.push('  Splat colour: ' + splatTint().join(' '));
      if (state.blood.splatter !== 1) L.push('  Splatter size: x' + state.blood.splatter);
      L.push('');
      L.push('Servers that block client mods ignore these files.');
      return L.join('\r\n') + '\r\n';
    }

    const zipName = () => (state.pack ? state.pack.fileName.replace(/\.[^.]+$/, '').replace(/[^\w.-]+/g, '_') + '-bloodfx-maker.zip' : 'bloodfx-maker.zip');
    const SAVE_ERRORS = {
      declined: null,
      rejected_extension: "This view can't save zip files.",
      extension_not_enabled: "This view can't save zip files.",
      too_large: 'The zip is too large to save here.',
      rate_limited: 'A save prompt is already open. Finish that one first.',
      unavailable: 'Saving files only works when this page is open in Claude or a browser.',
    };
    let saving = false;
    async function save() {
      if (saving) return;
      saving = true;
      try {
        const files = await buildFiles('zip');
        if (!files) return;
        busy('Packing the zip…');
        await tick(20);
        const zip = U.makeZip([
          { name: files.kind === 'ypt' ? 'core.ypt' : 'mods/' + files.rpfName, data: files.rpf },
          { name: 'citizen/common/data/effects/bloodfx.dat', data: files.dat },
          { name: 'INSTALL.txt', data: new TextEncoder().encode(installText(files)) },
        ]);
        const name = zipName();
        idle();
        const res = await P.saveZip(name, zip);
        if (res && res.saved) {
          savedAt = history.current;
          renderNote();
          toast('ok', 'Saved ' + name, res.path ? res.path : 'Unzip it, then follow the steps on the Install page.',
            res.path && P.kind === 'desktop' ? [{ label: 'Show file', run: () => P.revealFile(res.path) }] : [{ label: 'Install steps', run: () => go('install') }]);
        }
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') toast('info', 'Not saved');
        else toast('bad', "Couldn't save", SAVE_ERRORS[code] || (e && e.message ? e.message : String(e)));
      } finally {
        saving = false;
        idle();
      }
    }

    async function install() {
      if (!P.canInstall) {
        go('install');
        toast('info', 'Save the zip, then copy two files', 'The Install page shows where each one goes. The Windows app can do it for you.');
        return;
      }
      if (saving) return;
      if (state.pack && state.pack.kind === 'ypt') {
        toast('bad', "A loose core.ypt can't go in the mods folder", "Open the pack's .rpf instead, or save the zip and use the core.ypt in a resource.");
        return;
      }
      saving = true;
      try {
        const where = await P.fivem.detect();
        if (!where || !where.found) {
          go('install');
          toast('bad', "Couldn't find FiveM", 'Choose your FiveM.app folder on the Install page.');
          return;
        }
        const files = await buildFiles('install');
        if (!files) return;
        idle();
        const scan = await P.fivem.scan();
        const others = (scan.mods || []).filter((m) => m.enabled && m.hasCore !== false && m.name.toLowerCase() !== files.rpfName.toLowerCase());
        let disable = [];
        if (others.length) {
          const pick = await confirmBox({
            title: 'Other packs also change the tracer',
            text: 'FiveM only uses one core.ypt pack at a time. Turn these off so yours is the one that plays? They are renamed to .disabled, and you can turn them back on from the Install page.',
            items: others.map((m) => m.name + (m.hasCore === null ? ' (couldn’t check inside)' : '')),
            buttons: [{ label: 'Cancel', value: null, ghost: true }, { label: 'Leave them on', value: 'keep' }, { label: 'Turn them off and install', value: 'off', primary: true }],
          });
          if (!pick) return;
          if (pick === 'off') disable = others.map((m) => m.name);
        }
        busy('Installing…');
        const res = await P.fivem.install({ rpfName: files.rpfName, rpf: files.rpf, dat: files.dat, disable });
        savedAt = history.current;
        renderNote();
        changed('install');
        toast('ok', 'Installed. Start FiveM to see it.', [`${files.rpfName} → mods`, 'bloodfx.dat → citizen\\common\\data\\effects', res.backup ? 'Old files backed up' : null, disable.length ? `Turned off ${plural(disable.length, 'pack')}` : null].filter(Boolean).join(' · '),
          [{ label: 'Install page', run: () => go('install') }]);
      } catch (e) {
        toast('bad', "Couldn't install", e && e.message ? e.message : String(e));
      } finally {
        saving = false;
        idle();
      }
    }

    // ------------------------------------------------------------ toasts, busy, dialogs
    function toast(kind, text, small, actions, ms) {
      const iconName = kind === 'ok' ? 'check' : kind === 'bad' ? 'warn' : 'info';
      const el = h('div.toast.' + kind, { role: kind === 'bad' ? 'alert' : 'status' },
        h('span', { html: D.icon(iconName) }),
        h('div.msg', text, small ? h('small', small) : null),
        h('div.acts', (actions || []).map((a) => h('button.link', { type: 'button', onclick: () => { a.run(); el.remove(); } }, a.label)),
          h('button.icon-btn', { type: 'button', ariaLabel: 'Dismiss', title: 'Dismiss', style: { width: '24px', height: '24px' }, onclick: () => el.remove(), html: D.icon('x') })));
      const box = $('#toasts');
      box.append(el);
      while (box.children.length > 4) box.firstChild.remove();
      setTimeout(() => el.remove(), ms || (kind === 'bad' ? 12000 : 6000));
      return el;
    }
    function busy(text) { $('#busy-text').textContent = text || 'Working…'; $('#busy').hidden = false; }
    function idle() { $('#busy').hidden = true; }
    function confirmBox(o) {
      return new Promise((resolve) => {
        const prevFocus = document.activeElement;
        const buttons = o.buttons.map((b) => h('button.btn' + (b.primary ? '.primary' : '') + (b.ghost ? '.ghost' : ''), { type: 'button', onclick: () => done(b.value) }, b.label));
        const box = h('div.dialog', { role: 'dialog', attrs: { 'aria-modal': 'true', 'aria-labelledby': 'dlg-title' } },
          h('h3#dlg-title', o.title), o.text ? h('p', o.text) : null, o.items ? h('ul.dlg-list', o.items.map((i) => h('li', i))) : null, h('div.dlg-actions', buttons));
        const ov = h('div.overlay', box);
        function done(v) { ov.remove(); document.removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) prevFocus.focus(); resolve(v); }
        function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(null); } }
        document.addEventListener('keydown', onKey, true);
        document.body.append(ov);
        (buttons.find((b) => b.classList.contains('primary')) || buttons[0]).focus();
      });
    }

    // ------------------------------------------------------------ frame
    function setIcons(scope) {
      for (const el of $$('[data-icon]', scope)) { el.innerHTML = D.icon(el.dataset.icon); el.style.display = 'contents'; el.removeAttribute('data-icon'); }
    }
    $('#logo').innerHTML = D.LOGO;

    const tabsEl = $('#tabs');

    for (const t of TABS) {
      const b = h('button', { type: 'button', role: 'tab', id: 'tab-' + t.id, title: `${t.label} (${TABS.indexOf(t) + 1})`, attrs: { 'aria-selected': 'false', 'aria-controls': 'page-' + t.id } },
        h('span', { html: D.icon(t.icon), style: { display: 'contents' } }), t.label, h('span.badge', { hidden: true }));

      tabButtons.set(t.id, b);
    }
    tabsEl.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;

      tabButtons.get(next.id).focus();

    function renderTabs() {
      for (const t of TABS) {
        const b = tabButtons.get(t.id);

        b.setAttribute('aria-selected', on ? 'true' : 'false');

        badge.textContent = n;
      }
    }
    function renderHead() {
      const t = TABS.find((x) => x.id === state.tab);
      $('#ph-icon').innerHTML = D.icon(t.icon);
      $('#ph-title').textContent = t.title;
      $('#ph-text').textContent = t.text;
      const actions = clear($('#ph-actions'));
      const page = pages.get(t.id);
      if (page && page.actions) U.append(actions, [page.actions]);
    }
    function renderCrumbs() {
      const c = clear($('#crumbs'));
      const t = TABS.find((x) => x.id === state.tab);
      c.append(h('span', state.pack ? state.pack.fileName : 'No pack'), h('span', { html: D.icon('chevron'), style: { display: 'contents' } }), h('b', t.label));
    }
    function renderFileChip() {
      const chip = $('#file-chip');
      const p = state.pack;
      chip.classList.toggle('empty', !p);
      $('#file-chip-tag').textContent = p ? (p.kind === 'ypt' ? 'YPT' : 'RPF') : 'RPF';
      $('#file-chip-name').textContent = p ? p.fileName : 'No tracer pack open';
      chip.title = p ? `${p.fileName} (${U.fmtBytes(p.size)}). Click to open a different pack (Ctrl+O)` : 'Open a tracer pack (Ctrl+O)';
    }
    function renderStatus() {
      const s = clear($('#statusbar'));
      const p = state.pack;
      s.append(h('span.item', h('span.dot' + (p ? '.ok' : '')), p ? `${p.fileName}${p.texture ? ` · ${p.texture.format} ${p.texture.w}×${p.texture.h}` : ''}` : 'No tracer pack open'));
      s.append(h('span.item', 'Tracer: ' + describeBeam(state.tracer) + ', ' + describeSmoke(state.tracer)));
      const n = hitCount();
      s.append(h('span.item' + (n ? '.changes' : ''), n ? `Blood: ${plural(n, 'hit')} changed` : 'Blood: as the starting file'));
      const m = muzzleChoice();
      if (m) s.append(h('span.item.changes', `Muzzle: ${m.names.length} recoloured`));
      s.append(h('span.grow'));
      s.append(h('span.item', PLATFORM_LABEL[P.kind]));
      s.append(h('span.item', h('kbd', 'Space'), 'fire', h('kbd', 'Ctrl S'), 'save'));
    }
    function renderNote() {
      const dirty = history.current !== savedAt && history.past.length > 0;
      $('#tb-note').textContent = dirty ? 'Unsaved changes' : '';
    }

    // ------------------------------------------------------------ pages
    const pages = new Map();
    const pagesEl = $('#pages');
    function go(id) {
      if (!pages.has(id)) return;
      const prev = state.tab;
      state.tab = id;
      for (const [pid, p] of pages) p.el.hidden = pid !== id;
      const page = pages.get(id);
      if (page.viewSlot) {
        page.viewSlot.append(viewport);
        requestAnimationFrame(() => { preview.resize(); preview.start(); });
      }
      if (prev !== id && pages.get(prev) && pages.get(prev).left) pages.get(prev).left();
      if (page.shown) page.shown();
      renderTabs();
      renderHead();
      renderCrumbs();
      renderHud();
      U.store.set('tab', id);
    }

    function changed(what) {
      if (what === 'pack' || what === 'tracer' || what === 'all') {
        const s = sheet();
        preview.setSheet(s.px, s.w, s.h);
      }
      for (const p of pages.values()) if (p.refresh) p.refresh(what);
      renderTabs();
      renderStatus();
      renderFileChip();
      renderCrumbs();
      renderHud();
      renderUndo();
      if (what === 'pack') renderHead();
    }

    function applyAccent(id) {
      const a = D.ACCENTS.find((x) => x.id === id) || D.ACCENTS[0];
      const [r, g, b] = U.rgbOf(a.value);
      document.documentElement.style.setProperty('--accent', a.value);
      document.documentElement.style.setProperty('--accent-rgb', `${r}, ${g}, ${b}`);
    }
    function setSetting(key, value) {
      state.settings[key] = value;
      U.store.set('settings', state.settings);
      if (key === 'accent') applyAccent(value);
      if (key === 'tips') document.body.classList.toggle('no-tips', !value);
      if (key === 'auto') preview.set('auto', value);
      changed('settings');
    }
    applyAccent(state.settings.accent);
    document.body.classList.toggle('no-tips', !state.settings.tips);

    async function startOver() {
      const ok = await confirmBox({ title: 'Start over?', text: 'Every tracer, blood and muzzle change goes back to how it started. The open pack stays open.', buttons: [{ label: 'Cancel', value: false, ghost: true }, { label: 'Start over', value: true, primary: true }] });
      if (!ok) return;
      Object.assign(state.tracer, { style: state.pack ? 'keep' : 'solid', colour: '#ff2bd6', colour2: null, flip: false, core: '#ffffff', width: 3, tintOn: false, tint: '#ffffff',
        smoke: state.pack ? 'keep' : 'off', smokeColour: '#8a6bff', smokeColour2: null, smokeFlip: false, smokeWidth: 3 }, state.packValues);
      state.touched.clear();
      state.lookTouched = false;
      state.tracerPreset = null;
      Object.assign(state.blood, { base: 'builtin', hits: {}, dead: true, splatOn: false, splat: '#00a0ff', strength: 50, splatter: 1, preset: null });
      Object.assign(state.muzzle, { enabled: false, match: 'muz', colour: '#3b82ff', glowOn: false, glow: 20, picked: null });
      enforceWhole();
      changed('all');
      commit();
    }

    const app = {
      C, D, U, K, P, A, VERSION, TABS, MOTION, BUILTIN_DAT, CORE_FX, LONG_FX, state,
      changed, commit, go, toast, busy, idle, confirmBox, setSetting, startOver,
      openPackDialog, loadPack, openDatDialog, loadDat, pickScreenshot, useScreenshot, openAny, save, install,
      look, sheet, sheetFor, whole, enforceWhole, tracerSettings, describeBeam, describeSmoke, applyTracerPreset, drawnSmoke,
      blood, baseText, baseSummary, splatTint, applyBloodPreset, assignHits, resetHits, hitCount, fxInfo, fxWarning, catalogue, validFx,
      packContents, muzzleRules, muzzlePicked, muzzleChoice,
      preview, viewport, target, renderHud, installText, zipName,
    };

    for (const t of TABS) {
      const make = pageFactories[t.id];
      if (!make) continue;
      const page = make(app);
      page.el.id = 'page-' + t.id;
      page.el.setAttribute('role', 'tabpanel');

    }

    // ------------------------------------------------------------ toolbar, keys, drops
    $('#tb-open').addEventListener('click', openPackDialog);
    $('#file-chip').addEventListener('click', openPackDialog);
    $('#tb-dat').addEventListener('click', openDatDialog);
    $('#tb-undo').addEventListener('click', undo);
    $('#tb-redo').addEventListener('click', redo);
    $('#tb-fire').addEventListener('click', () => preview.fire());
    $('#tb-save').addEventListener('click', save);
    $('#tb-install').addEventListener('click', install);

    document.addEventListener('keydown', (e) => {
      if (!$('#busy').hidden || document.querySelector('.dialog')) return;
      const typing = e.target.closest && e.target.closest('input:not([type=range]):not([type=checkbox]):not([type=color]), textarea, select, [contenteditable]');
      const mod = e.ctrlKey || e.metaKey;
      const k = e.key.toLowerCase();
      if (mod && !e.altKey) {
        if (k === 'o') { e.preventDefault(); openPackDialog(); }
        else if (k === 's') { e.preventDefault(); save(); }
        else if (k === 'i') { e.preventDefault(); install(); }
        else if (k === 'z' && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
        else if (k === 'y' && !typing) { e.preventDefault(); redo(); }
        return;
      }
      if (typing || e.altKey) return;
      if (e.key === ' ' && !e.target.closest('button, a, input, select, [role=tab], [tabindex]')) { e.preventDefault(); preview.fire(); }
      else if (/^[1-7]$/.test(e.key) && !e.target.closest('input')) go(TABS[Number(e.key) - 1].id);
    });

    let dragDepth = 0;
    const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; dragDepth++; $('#drop-overlay').hidden = false; });
    window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop-overlay').hidden = true; });
    window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
    window.addEventListener('drop', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragDepth = 0;
      $('#drop-overlay').hidden = true;
      const f = e.dataTransfer.files[0];
      if (f) openAny(f);
    });
    P.onOpenPath(async (path) => {
      const f = await P.readRecent(path);
      if (f) loadPack(f); else toast('bad', `Couldn't open ${path}`);
    });

    // ------------------------------------------------------------ boot
    applyBloodPreset(D.BLOOD_PRESETS.find((p) => p.id === 'confetti'));
    history.past.length = 0;
    history.current = snap();
    savedAt = history.current;
    changed('all');
    const firstTab = U.store.get('tab', 'home');
    go(pages.has(firstTab) ? firstTab : 'home');
    preview.start();
    root.bfxApp = app; // for tests and the console
  }

  root.BfxApp = { start, VERSION };
})(typeof self !== 'undefined' ? self : this);

      body: [h('div', { style: { padding: '10px 10px 0' } }, h('label.search', h('span', { html: D.icon('search'), style: { display: 'contents' } }), search)), listBody] });
    const cards = new Map();
    const groupEls = [];
    {
      const groups = new Map();

<script>/* ui/pages/blood.js */
/* Blood workspace: presets, the hit map (body part × weapon), and the effect browser for the selected hits. */
(function (root) {
  'use strict';

  pages.blood = function (app) {
    const { U, D, K, A, state } = app;

    const sel = state.selection;

    const ALL = ZONES.flatMap((z) => WEAPONS.map((w) => cellId(z.id, w.id)));
    const ic = (name) => h('span', { html: D.icon(name), style: { display: 'contents' } });
    const zoneLabel = (z) => ZONES.find((x) => x.id === z).label;
    const weaponLabel = (w) => WEAPONS.find((x) => x.id === w).label;

    // ------------------------------------------------------------ presets
    const presetCards = new Map();
    const presetBody = h('div');
    {
      const groups = new Map();
      for (const p of D.BLOOD_PRESETS) { if (!groups.has(p.group)) groups.set(p.group, []); groups.get(p.group).push(p); }
      for (const [g, items] of groups) {
        presetBody.append(h('div.list-group', h('h4', g), h('div.card-list', items.map((p) => {
          const kind = app.fxInfo(p.fx).kind;
          const btn = h('button.tpl', { type: 'button', title: p.sub, onclick: () => { app.applyBloodPreset(p); app.preview.fire('head'); } },
            h('span.thumb', h('span.fx', { html: D.fxIcon(kind) })), h('span', h('div.nm', p.name), h('div.sb', p.sub)));

    }
    const listPanel = K.panel({ title: 'Presets', headId: 'bl-list-h', count: D.BLOOD_PRESETS.length, cls: 'area-list', flush: true, scroll: true, body: [presetBody] });

    // ------------------------------------------------------------ viewport
    const sceneSeg = K.miniSeg([['street', 'Street'], ['range', 'Range'], ['image', 'Screenshot', 'Use your own GTA screenshot as the background']],
      () => app.preview.get('scene'), (v) => {
        if (v === 'image' && !app.preview.get('image')) { app.pickScreenshot().then(() => sceneSeg.update()); return; }
        app.preview.set('scene', v);

    const fire = h('button.fire-btn', { type: 'button', title: 'Shoot the selected body part', onclick: () => shoot() }, ic('fire'), 'Fire', h('kbd', 'Space'));
    const viewPanel = K.panel({ title: 'Preview', headId: 'bl-view-h', cls: 'area-view', tools: [h('div.vp-tools', sceneSeg.el, fire)] });
    viewPanel.body.remove();
    function aim() {
      const first = [...sel][0];

      app.target.zone = zone;
      app.target.weapon = weapon;
      app.preview.set('focus', zone === 'animals' ? 'body' : zone);

    }
    function shoot() { aim(); app.preview.fire(app.target.zone === 'animals' ? 'body' : app.target.zone || 'head'); }

    // ------------------------------------------------------------ hit map
    const map = h('div.hitmap', { role: 'grid', ariaLabel: 'Hits: body part by weapon type' });
    const cellEls = new Map();
    const corner = h('button.hm-col', { type: 'button', title: 'Select every hit', onclick: (e) => selectCells(ALL, e) }, 'All');
    map.append(h('div.hm-corner', corner));
    for (const w of WEAPONS) {
      map.append(h('button.hm-col', { type: 'button', title: `Select ${w.label.toLowerCase()} (${w.sub})`, onclick: (e) => selectCells(ZONES.map((z) => cellId(z.id, w.id)), e) }, ic(w.id), w.label));
    }

    });

      pressing = false;
      dragging = false;

    });

      selectionChanged(true);
    }

    const mapPanel = K.panel({ title: 'Hits', headId: 'bl-map-h', cls: 'area-map', scroll: true, body: [h('div.map-scroll', map)],
      tools: [h('span.muted', { style: { fontSize: '11.5px' } }, 'Click a hit, drag for several. Ctrl-click to add.')] });

      const zones = new Set([...sel].map((c) => c.split(':')[0])), weapons = new Set([...sel].map((c) => c.split(':')[1]));

      if (counts.get('other')) chips.append(make('other', D.CATEGORY_LABEL.other, counts.get('other')));

    function renderList() {
      clear(fxList);

      const current = selFx();
      let items = app.catalogue();
      if (!q && filter === 'suggested') items = items.filter((f) => f.curated);
      else if (!q && filter !== 'all') items = items.filter((f) => f.cat === filter);

      h('div.tip', ic('warn'), h('span', 'Nothing here has been tested in game by the maker itself. Every file is checked by reading it back, and was checked with CodeWalker on 12 real packs.')));

    // ------------------------------------------------------------ by hand (web)
    const copyBtn = (text) => {
      const b = h('button.btn.small', { type: 'button' }, ic('copy'), 'Copy');
      b.addEventListener('click', () => {
        try { navigator.clipboard.writeText(text).then(() => { b.lastChild.textContent = 'Copied'; setTimeout(() => { b.lastChild.textContent = 'Copy'; }, 1500); }, () => {}); } catch { /* the path is selectable */ }
      });
      return b;
    };
    const handPanel = panel('Install by hand',
      h('ol.steps',
        h('li', 'Close FiveM.'),
        h('li', 'Unzip the file you saved.'),
        h('li', 'Put the .rpf from the zip’s ', h('code', 'mods'), ' folder in your FiveM mods folder. Remove the old copy of that pack, and any other pack that changes the tracer.', h('div.path-box', { style: { marginTop: '6px' } }, h('span', { style: { flex: '1' } }, MODS), copyBtn(MODS))),
        h('li', 'Put ', h('code', 'bloodfx.dat'), ' here. Make the folders if they’re missing, and back up any bloodfx.dat already there.', h('div.path-box', { style: { marginTop: '6px' } }, h('span', { style: { flex: '1' } }, EFFECTS), copyBtn(EFFECTS))),
        h('li', 'Start FiveM.')),
      P.canInstall ? null : h('div.note.info', 'The Windows app version of BloodFX Maker does these steps for you, keeps backups, and can turn other tracer packs off.'));

    // ------------------------------------------------------------ desktop: FiveM folder, mods, backups
    const fivemDot = h('span.state-dot'), fivemPath = h('span', { style: { flex: '1' } }, 'Looking for FiveM…');
    const fivemPanel = panel('FiveM',
      h('div.path-box', fivemDot, fivemPath),
      h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
        h('button.btn.small', { type: 'button', onclick: () => detect(true) }, ic('search'), 'Find again'),
        h('button.btn.small', { type: 'button', onclick: async () => { const r = await P.fivem.choose(); if (r) { where = r; renderWhere(); scan(); } } }, ic('folder'), 'Choose FiveM.app…'),
        h('button.btn.small', { type: 'button', onclick: () => P.fivem.open('mods') }, ic('open'), 'Open mods folder'),
        h('button.btn.small', { type: 'button', onclick: () => P.fivem.open('effects') }, ic('open'), 'Open effects folder')));
    const modsBox = h('div', { style: { display: 'grid', gap: '6px' } });
    const modsPanel = panel('Packs in your mods folder', h('p.explain', 'Turning a pack off renames it to .disabled, so FiveM skips it. Turn it back on any time.'), modsBox);
    const backupsBox = h('div', { style: { display: 'grid', gap: '6px' } });
    const backupsPanel = panel('Backups', h('p.explain', 'Every install backs up the files it replaces. Restore puts them back and turns the packs it turned off back on.'), backupsBox);
    let where = null;
    async function detect(again) {
      try { where = await P.fivem.detect(); } catch (e) { where = { found: false, error: e.message }; }
      renderWhere();
      if (where && where.found) { scan(); backups(); } else { clear(modsBox).append(h('p.field-help', 'FiveM not found yet.')); }
      if (again && where && where.found) app.toast('ok', 'Found FiveM', where.root);
    }
    function renderWhere() {
      fivemDot.className = 'state-dot ' + (where && where.found ? 'ok' : 'bad');
      fivemPath.textContent = where && where.found ? where.root : (where && where.error) || 'FiveM.app not found. Choose its folder; it is usually in %localappdata%\\FiveM.';
    }
    async function scan() {
      let res;
      try { res = await P.fivem.scan(); } catch (e) { clear(modsBox).append(h('p.note.bad', e.message)); return; }
      clear(modsBox);
      if (!res.mods.length) { modsBox.append(h('p.field-help', 'Your mods folder is empty.')); return; }
      for (const m of res.mods) {
        const input = h('input', { type: 'checkbox', role: 'switch', checked: m.enabled, ariaLabel: (m.enabled ? 'Turn off ' : 'Turn on ') + m.name });
        input.addEventListener('change', async () => {
          try { await P.fivem.toggle(m.name, input.checked); scan(); } catch (e) { app.toast('bad', "Couldn't change " + m.name, e.message); scan(); }
        });
        modsBox.append(h('div.mod-row', h('div', h('div.nm', m.name), h('div.meta', h('span', U.fmtBytes(m.size)),
          m.hasCore ? h('span.tag.accent', 'changes the tracer') : m.hasCore === null ? h('span.tag', 'couldn’t look inside') : null,
          m.enabled ? null : h('span.tag.off', 'off'))), h('label.switch', input)));
      }
      const on = res.mods.filter((m) => m.enabled && m.hasCore);
      if (on.length > 1) modsBox.prepend(h('div.note', `${plural(on.length, 'pack')} that change the tracer are on. Only one of them will show in game.`));
    }
    async function backups() {
      let list = [];
      try { list = await P.fivem.backups(); } catch { list = []; }
      clear(backupsBox);
      if (!list.length) { backupsBox.append(h('p.field-help', 'No backups yet.')); return; }
      for (const b of list.slice(0, 8)) {
        backupsBox.append(h('div.backup-row', h('div', h('div.when', new Date(b.when).toLocaleString()), h('div.files', b.files.join(' · ') || 'nothing replaced')),
          h('button.btn.small', { type: 'button', onclick: async () => {
            const ok = await app.confirmBox({ title: 'Restore this backup?', text: 'The files it holds are copied back, and packs that install turned off are turned on again.', items: b.files,
              buttons: [{ label: 'Cancel', value: false, ghost: true }, { label: 'Restore', value: true, primary: true }] });
            if (!ok) return;
            try { await P.fivem.restore(b.id); app.toast('ok', 'Restored'); scan(); backups(); } catch (e) { app.toast('bad', "Couldn't restore", e.message); }
          } }, ic('restore'), 'Restore')));
      }
    }

    function renderSaved() {
      const p = state.pack;
      tracerName.textContent = p ? (p.kind === 'ypt' ? 'core.ypt' : p.fileName) : 'Your tracer pack (.rpf)';
      tracerTo.textContent = p && p.kind === 'ypt' ? "A loose core.ypt: put it in a resource's stream folder or inside your pack with OpenIV" : MODS;
      tracerWhat.textContent = (p ? '' : 'Open a pack first. ') + 'Tracer: ' + app.describeBeam(state.tracer) + ', ' + app.describeSmoke(state.tracer) + (app.muzzleChoice() ? `; ${app.muzzleChoice().names.length} muzzle flashes recoloured` : '');
      const n = app.hitCount();
      bloodWhat.textContent = (n ? `${plural(n, 'hit')} changed` : 'No hit changes') + (state.blood.splatOn ? ' · new splat colour' : '') + (state.blood.splatter !== 1 ? ` · splatter ×${state.blood.splatter}` : '');
      const t = state.tracer;
      A.tracerThumb(tracerArt, { sheet: app.sheet(), glowColour: t.style === 'keep' ? '#ffb070' : t.colour, glow: t.glow, zoom: t.zoom, smoke: t.smoke !== 'off', beam: t.style !== 'none' }, { w: 52, h: 52, width: 14 });
    }

    const cols = P.canInstall
      ? [h('div.col', whatPanel, fivemPanel, tips), h('div.col', modsPanel, backupsPanel)]
      : [h('div.col', whatPanel, tips), h('div.col', handPanel)];
    const el = h('section.page-scroll.scroll', h('div.install', cols));
    let first = true;
    function refresh(what) {
      if (what === 'install') { if (P.canInstall) { scan(); backups(); } return; }
      if (!el.hidden) renderSaved();
    }
    return { el, actions: [], refresh, shown: () => { renderSaved(); if (P.canInstall) { if (first) detect(false); else { scan(); backups(); } first = false; } } };
  };
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* ui/pages/settings.js */
/* Settings: accent colour, preview defaults, tips, start over, and what the maker can and can't do. */
(function (root) {
  'use strict';
  const pages = (root.BfxPages = root.BfxPages || {});

  pages.settings = function (app) {
    const { U, D, K, P, state } = app;
    const { h } = U;
    const ic = (name) => h('span', { html: D.icon(name), style: { display: 'contents' } });
    const s = state.settings;
    const row = (label, sub, ...ctrl) => h('div.set-row', h('div.k', label, sub ? h('span', sub) : null), h('div', ctrl));
    const panel = (title, ...body) => h('section.panel', h('div.panel-head', h('h2', title)), h('div.panel-body', body));

    const accents = h('div.accent-row', { role: 'group', ariaLabel: 'Accent colour' }, D.ACCENTS.map((a) => h('button', {
      type: 'button', title: a.label, ariaLabel: a.label, dataset: { v: a.id }, style: { background: a.value },
      onclick: () => { app.setSetting('accent', a.id); sync(); },
    })));
    const scene = K.miniSeg([['street', 'Street'], ['range', 'Range']], () => (s.scene === 'image' ? 'street' : s.scene), (v) => { app.setSetting('scene', v); app.preview.set('scene', v); }, 'Default scene');
    const camera = K.miniSeg([['side', 'Side'], ['shooter', 'Shooter']], () => s.camera, (v) => { app.setSetting('camera', v); app.preview.set('camera', v); }, 'Default camera');
    const auto = K.toggle({ label: 'Fire on its own', sub: 'Shoots every couple of seconds while the preview is on screen', get: () => s.auto, set: (v) => app.setSetting('auto', v) });
    const tips = K.toggle({ label: 'Show tips', sub: 'Short explanations next to the controls', get: () => s.tips, set: (v) => app.setSetting('tips', v) });
    const keys = [['Ctrl O', 'Open a tracer pack'], ['Ctrl S', 'Save the zip'], ['Ctrl I', P.canInstall ? 'Install to FiveM' : 'How to install'], ['Ctrl Z / Ctrl Y', 'Undo / redo'], ['Space', 'Fire a test shot'], ['1 – 7', 'Switch page']];

    const box = h('div.settings',
      panel('Look', row('Accent colour', 'Buttons, tabs and highlights', accents)),
      panel('Preview', row('Scene', 'Or drop a GTA screenshot on the window', scene.el), row('Camera', null, camera.el), h('div', { style: { paddingTop: '12px' } }, auto.el)),
      panel('Help', tips.el, h('table.table', { style: { marginTop: '12px' } }, h('tbody', keys.map(([k, v]) => h('tr', h('td', h('kbd', k)), h('td', v)))))),
      panel('Start over', h('div.set-row', h('div.k', 'Undo every change', h('span', 'Tracer, blood and muzzle flash go back to how they started. The open pack stays open.')),
        h('div', h('button.btn', { type: 'button', onclick: () => app.startOver() }, ic('reset'), 'Start over')))),
      panel('About', h('dl.facts',
        h('dt', 'Version'), h('dd', `BloodFX Maker ${app.VERSION} · ${P.kind === 'desktop' ? 'Windows app' : 'web page'}`),
        h('dt', 'Your files'), h('dd', 'Read and rebuilt on this computer. Nothing is uploaded.'),
        h('dt', 'Preview'), h('dd', "A sketch of the tracer and hit, drawn from the pack's real tracer sheet and timing. It isn't GTA's renderer: CodeWalker and OpenIV can't play particles either, so the only exact preview is the game."),
        h('dt', 'Recolouring'), h('dd', 'DXT1 and DXT5 tracer sheets keep their exact shape and transparency when recoloured. BC7 sheets (sleep, slow confetti, white confetti, xans) can be kept or redrawn, not recoloured.'),
        h('dt', 'Not tested in game'), h('dd', 'Every output is checked by reading it back, and was checked with CodeWalker on 12 real packs. Tell the maker’s author what you see in game.'))));
    const el = h('section.page-scroll.scroll', box);
    function sync() {
      for (const b of accents.children) b.setAttribute('aria-pressed', b.dataset.v === s.accent ? 'true' : 'false');
      scene.update(); camera.update(); auto.update(); tips.update();
    }
    sync();
    return { el, actions: [], refresh: (what) => { if (what === 'settings' || what === 'all') sync(); }, shown: sync };
  };
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* ui/boot.js */
/* Starts BloodFX Maker once every module has loaded. */
(function (root) {
  'use strict';
  try {
    root.BfxApp.start(root.BfxPages || {});
  } catch (e) {
    const box = document.getElementById('fatal');
    document.getElementById('fatal-text').textContent = 'BloodFX Maker hit an error while starting: ' + (e && e.message ? e.message : String(e));
    box.hidden = false;
    throw e;
  }
})(typeof self !== 'undefined' ? self : this);
